<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<script>try{var t=localStorage.getItem("sales.theme");document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<title>年度業績分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: frosted top bar (brand · filters · tabs) over a soft grid + glow backdrop on charcoal gray;
   overview opens with a hero figure beside a tilted chart "console", then KPI tiles and chart panels.
   Single charcoal theme with a blue-led palette tuned for gray grounds; large type and comfortable contrast for older readers. */
:root{
  color-scheme:dark;
  --bg:#22272e; --bg-2:#1c2128; --panel:#2d333b; --panel-2:#373e47; --panel-3:#272d35;
  --ink:#e6edf3; --ink-2:#c5d1de; --ink-3:#9aa7b4;
  --line:#444c56; --line-2:#545d68; --grid:#38404a;
  --accent:#539bf5; --accent-2:#39c5cf; --accent-ink:#ffffff; --accent-soft:rgba(83,155,245,.12);
  --bar:#539bf5; --bar-dim:#4a5563;
  --s1:#539bf5; --s2:#e0823d; --s3:#57ab5a; --s4:#39c5cf; --s5:#b083f0; --s6:#768390;
  --tA:#96d0ff; --tB:#539bf5; --tC:#3f6aa8;
  --good:#6bc46d; --good-bg:rgba(87,171,90,.16); --bad:#f47067; --bad-bg:rgba(244,112,103,.15); --warn:#daaa3f; --warn-bg:rgba(218,170,63,.15);
  --grad:linear-gradient(90deg,#539bf5,#39c5cf);
  --f-sans:"Geist","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"Geist Mono","Noto Sans TC",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 28px -14px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15.5px;line-height:1.6;margin:0;min-height:100vh;position:relative;-webkit-font-smoothing:antialiased;max-width:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 90% 55% at 50% 0%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 90% 55% at 50% 0%,#000 20%,transparent 75%)}
body::after{content:"";position:fixed;left:0;right:0;top:-280px;width:100%;max-width:100vw;height:560px;pointer-events:none;z-index:0;
  background:radial-gradient(closest-side,rgba(83,155,245,.20),transparent 70%),radial-gradient(closest-side at 72% 60%,rgba(57,197,207,.14),transparent 70%);filter:blur(10px)}
header.top,.wrap,.toast{position:relative;z-index:1}
.wrap{max-width:1280px;margin:0 auto;padding-inline:24px;padding-block:0 64px}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(28,33,40,.85);-webkit-backdrop-filter:blur(14px) saturate(130%);backdrop-filter:blur(14px) saturate(130%);border-bottom:1px solid var(--line)}
.topin{max-width:1280px;margin:0 auto;padding:12px 24px 0;display:flex;flex-direction:column;gap:12px}
.row1{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,#539bf5,#39c5cf);box-shadow:0 6px 18px -6px rgba(83,155,245,.6),inset 0 1px 0 rgba(255,255,255,.3)}
.logo svg{width:20px;height:20px}
h1{font-size:19px;margin:0;letter-spacing:.01em;font-weight:700;text-wrap:balance}
.sub{color:var(--ink-3);font:500 12.5px/1.5 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.sub .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(87,171,90,.2);margin-right:8px;vertical-align:1px}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ctrls label{font:600 13px var(--f-sans);color:var(--ink-2);display:flex;align-items:center;gap:6px}
select,input[type=search],input[type=number],input[type=password]{font:inherit;font-size:15px;color:var(--ink);background:var(--bg-2);border:1px solid var(--line-2);border-radius:10px;padding:7px 12px;min-height:40px;transition:border-color .15s,box-shadow .15s}
select:hover,input:hover{border-color:#6e7781}
select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(83,155,245,.22)}
input[type=search]{min-width:0;width:260px;max-width:100%}
input::placeholder{color:#8b96a3}
button{font:inherit;font-size:15px;cursor:pointer;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);padding:7px 16px;min-height:40px;transition:background .15s,border-color .15s,box-shadow .15s,transform .1s}
button:hover{background:#424a54;border-color:#6e7781}
button:active{transform:translateY(1px)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:linear-gradient(180deg,#5aa2f7,#4184e4);color:#fff;border-color:#4184e4;font-weight:700;box-shadow:0 6px 18px -8px rgba(83,155,245,.8),inset 0 1px 0 rgba(255,255,255,.18)}
button.primary:hover{background:#539bf5}
button.danger{color:var(--bad);border-color:rgba(244,112,103,.45);background:var(--bad-bg)}
button:focus-visible,.tab:focus-visible{outline:3px solid rgba(83,155,245,.55);outline-offset:2px}

/* tabs */
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;border-radius:8px 8px 0 0;background:none;box-shadow:none;padding:10px 16px 12px;color:var(--ink-3);white-space:nowrap;min-height:0;position:relative;font-weight:500;font-size:15.5px}
.tab:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.tab[aria-selected=true]{color:var(--ink);font-weight:700}
.tab[aria-selected=true]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px;background:var(--grad)}

main{display:flex;flex-direction:column;gap:20px;padding-top:26px;min-width:0;max-width:100%}
main>*{min-width:0;max-width:100%}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;align-items:stretch}
.hero-l{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:8px 4px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font:600 12.5px var(--f-mono);letter-spacing:.1em;color:var(--accent);padding:5px 12px;border:1px solid rgba(83,155,245,.35);border-radius:999px;background:rgba(83,155,245,.08)}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(83,155,245,.2)}
.hero-num{font-size:clamp(44px,6vw,68px);font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#f0f6fc 40%,#9fc1ea);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-num small{font-size:.4em;letter-spacing:0;margin-left:6px}
.hero-d{font:600 15px var(--f-mono);color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px 16px}
.hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.hero-stats div{padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.hero-stats div+div{border-left:1px solid var(--line)}
.hero-stats span{font:600 12.5px var(--f-sans);color:var(--ink-3)}
.hero-stats b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.console{perspective:1400px}
.console .card{transform-origin:50% 100%;animation:tiltIn 1.1s cubic-bezier(.2,.8,.2,1) both;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 30px 70px -30px rgba(83,155,245,.45),0 12px 30px -18px rgba(0,0,0,.6)}
@keyframes tiltIn{from{transform:rotateX(18deg) translateY(16px)}to{transform:none}}
.wbar{display:flex;align-items:center;gap:6px;font:600 13px var(--f-sans);color:var(--ink-2)}
.wbar i{width:9px;height:9px;border-radius:50%}
.wbar i:nth-child(1){background:#f47067}.wbar i:nth-child(2){background:#daaa3f}.wbar i:nth-child(3){background:#57ab5a}
.wbar span{margin-left:8px}

/* tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.kpi{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 14px;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:var(--shadow);transition:border-color .2s}
.kpi:hover{border-color:var(--line-2)}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad);opacity:.9}
.kpi .k{font:600 14px var(--f-sans);color:var(--ink-2)}
.kpi .v{font-size:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .v small{font-size:15px;font-weight:600;color:var(--ink-3);margin-left:4px;letter-spacing:0}
.kpi .d{font:500 14px var(--f-sans);color:var(--ink-2);font-variant-numeric:tabular-nums}
.kpi .spark{height:36px;margin-top:6px;display:block;width:100%}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:20px}
@media (max-width:960px){.grid2,.grid3,.hero{grid-template-columns:minmax(0,1fr)}}
.card{position:relative;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.card h2::before{content:"";width:8px;height:8px;border-radius:3px;background:linear-gradient(135deg,#539bf5,#39c5cf);flex:none}
.card .hint{font-size:14px;color:var(--ink-3);margin:-6px 0 0}
.cv{position:relative;height:300px}
.cv.tall{height:380px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font:500 14px var(--f-sans);color:var(--ink-2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:-1px}

/* tables */
.tw{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;border:1px solid var(--line);border-radius:10px;background:var(--panel-3)}
table{border-collapse:collapse;width:100%;font:14.5px var(--f-mono);font-variant-numeric:tabular-nums}
th,td{padding:10px 14px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th{font:600 13.5px var(--f-sans);color:var(--ink-2);background:#333a43;position:sticky;top:0;z-index:1;border-bottom:1px solid var(--line)}
th.l,td.l{text-align:left}
td.l{font-family:var(--f-sans)}
tbody tr{transition:background .12s}
tbody tr:nth-child(even) td{background:rgba(255,255,255,.025)}
tbody tr:hover td{background:rgba(83,155,245,.12)}
tbody tr:last-child td{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:4px;font:700 12.5px var(--f-mono);padding:2px 9px;border-radius:6px;letter-spacing:.02em;border:1px solid transparent;line-height:1.5}
.pA{background:rgba(150,208,255,.16);color:#cae8ff;border-color:rgba(150,208,255,.5)}
.pB{background:rgba(83,155,245,.16);color:#a5ccfb;border-color:rgba(83,155,245,.45)}
.pC{background:rgba(118,131,144,.14);color:#c5d1de;border-color:rgba(118,131,144,.4)}
.pBad{background:var(--bad-bg);color:var(--bad);border-color:rgba(244,112,103,.4)}
.pGood{background:var(--good-bg);color:var(--good);border-color:rgba(107,196,109,.4)}
.pWarn{background:var(--warn-bg);color:var(--warn);border-color:rgba(218,170,63,.4)}
.pMuted{background:rgba(255,255,255,.04);color:var(--ink-2);border-color:var(--line-2)}
.up{color:var(--good);font-weight:600}.down{color:var(--bad);font-weight:600}.mut{color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{padding:4px 14px;border-radius:999px;font-size:14px;min-height:34px}
.chip[aria-pressed=true]{background:rgba(83,155,245,.18);border-color:var(--accent);color:#e6edf3;font-weight:700}
.rule{position:relative;border:1px solid var(--line-2);background:linear-gradient(90deg,rgba(83,155,245,.14),rgba(57,197,207,.08) 60%,transparent);border-radius:var(--r);padding:14px 18px;font-size:15px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.rule b{color:var(--ink)}
.bar-in{display:inline-block;height:7px;border-radius:4px;background:linear-gradient(90deg,#4a5563,#539bf5);vertical-align:middle;margin-right:8px}
.drop{border:2px dashed #5b6470;border-radius:var(--r);padding:32px 16px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:center;background:radial-gradient(ellipse at 50% 0%,rgba(83,155,245,.12),transparent 70%),var(--panel-3);transition:border-color .2s,background .2s}
.drop.over{border-color:var(--accent);background:rgba(83,155,245,.14)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#e6edf3;color:#1c2128;padding:12px 18px;border-radius:10px;font-size:15px;max-width:calc(100% - 32px);z-index:20;box-shadow:0 20px 50px -10px rgba(0,0,0,.6)}
.empty{color:var(--ink-3);padding:20px;text-align:center}
.flex{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.note{font-size:14px;color:var(--ink-3)}
.preview{border:1px solid rgba(83,155,245,.5);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;background:rgba(83,155,245,.07)}

/* lock screen */
.lock{max-width:460px;width:100%;margin:8vh auto 0;align-items:center;text-align:center;padding:36px 28px 28px;gap:16px;box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 40px 90px -40px rgba(83,155,245,.55)}
.lock h2{justify-content:center;font-size:22px}
.lock h2::before{display:none}
.lock-ic{width:60px;height:60px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,#539bf5,#39c5cf);box-shadow:0 12px 30px -10px rgba(83,155,245,.7)}
.lock-ic svg{width:26px;height:26px}
.lock form{display:flex;gap:8px;width:100%}
.lock input{flex:1;min-width:0;min-height:46px;font-size:17px}
.lock button{min-height:46px;font-size:16px}
.lock .tag{font:600 12px var(--f-mono);letter-spacing:.12em;color:var(--ink-3)}

@media (max-width:560px){th,td{padding:9px 10px}.custT td:first-child{position:sticky;left:0;z-index:1;background:var(--panel-3)}.custT th:first-child{position:sticky;left:0;z-index:2}.wrap,.topin{padding-inline:16px}.kpi .v{font-size:28px}.hero-stats b{font-size:16px}.hero-stats div{padding:10px 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- 品項分析 ---- */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2)}
.seg button{border:0;background:none;box-shadow:none;min-height:40px;padding:6px 16px;border-radius:9px;color:var(--ink-3);font-weight:600;font-size:15px}
.seg button:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2),0 0 0 1px rgba(83,155,245,.15)}
.itbar{gap:10px}
.split{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:960px){.split{grid-template-columns:minmax(0,1fr)}}
.clist{display:flex;flex-direction:column;gap:2px;max-height:760px;overflow:auto;margin:0 -6px;padding:0 6px}
@media (max-width:960px){.clist{max-height:300px}}
.citem{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;border:1px solid transparent;background:none;box-shadow:none;border-radius:10px;padding:9px 10px;min-height:0}
.citem:hover{background:rgba(255,255,255,.04)}
.citem[aria-pressed=true]{background:rgba(83,155,245,.1);border-color:rgba(83,155,245,.45)}
.citem .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .d{font:600 13px var(--f-mono);text-align:right}
.citem .r{grid-column:1/-1;font-size:12.5px;color:var(--ink-3)}
.citem .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--grid);position:relative;overflow:hidden}
.citem .bar i{position:absolute;top:0;bottom:0;border-radius:2px}
.dhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.dhead h3{margin:0;font-size:22px}
tr.sub td{background:rgba(0,0,0,.18)!important;font-size:13.5px}
tr.sub td.l:first-child{padding-left:34px}
tr.clk{cursor:pointer}
tr.clk td:first-child::before{content:"▸";display:inline-block;width:14px;color:var(--ink-3);transition:transform .15s}
tr.clk.open td:first-child::before{transform:rotate(90deg)}
.chg{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
.chg i{display:inline-block;height:6px;border-radius:3px}
.sticky1 td:first-child,.sticky1 th:first-child{position:sticky;left:0;z-index:1;background:var(--panel-3)}
.sticky1 th:first-child{z-index:2;background:#333a43}
.itbtn{min-height:32px;padding:3px 10px;font-size:13.5px;white-space:nowrap}
.kclick{cursor:pointer;display:grid}.kclick>.kpi{height:100%}.kclick:hover>.kpi{border-color:var(--pg)}
.mxb{min-height:30px;min-width:44px;padding:2px 10px;font:inherit;font-weight:700;color:inherit;background:rgba(255,255,255,.04);border:1px solid var(--line-2);border-radius:8px}
.mxb:hover{border-color:var(--pg)}.mxb.on{background:color-mix(in srgb,var(--pg) 28%,transparent);border-color:var(--pg)}
td.custlink{cursor:pointer;color:var(--accent);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);text-underline-offset:3px}
td.custlink:hover{text-decoration-color:var(--accent)}
.tv{border-radius:6px;padding:1px 8px;font-weight:600;font-size:13px;white-space:nowrap}
.tv.s0{background:#173a26;color:#7fe0a5}.tv.s1{background:#3a3214;color:#f0d06a}.tv.s2{background:#3e2814;color:#f5a560}.tv.s3{background:#431c1c;color:#ff8f8f}.tv.s4{background:var(--panel-2);color:var(--ink-3)}
:root[data-theme=light] .tv.s0{background:#e8eee4;color:#4c6447}:root[data-theme=light] .tv.s1{background:#f3ecdc;color:#7d6640}:root[data-theme=light] .tv.s2{background:#fde3cc;color:#9a4300}:root[data-theme=light] .tv.s3{background:#f3e2de;color:#94403a}
.itwhy{min-height:32px;font-size:14px;padding:2px 8px;width:auto;max-width:150px}
.pCs{background:rgba(57,197,207,.12);color:var(--accent-2);border-color:rgba(57,197,207,.45)}
.itbtn2{background:none;border-style:dashed;color:var(--ink-2)}
.pEol{background:rgba(176,131,240,.15);color:#dcc4ff;border-color:rgba(176,131,240,.5)}
.tlc{min-width:380px;width:42%;padding-top:4px!important;padding-bottom:4px!important}
svg.tl{display:block;width:100%}
.tlx{position:relative;height:18px;font:600 12.5px var(--f-mono);color:var(--ink-3)}
.tlx span{position:absolute;top:0;transform:translateX(-50%)}
select:disabled{opacity:.45;cursor:not-allowed}
/* ---- 區分度：每個分頁一個主色、KPI 卡輪流配色、表頭帶分頁色 ---- */
#main{--pg:#539bf5}
#main[data-tab=overview]{--pg:#539bf5}
#main[data-tab=rep]{--pg:#b083f0}

<script id="logic">
/* ---------- 計算核心（與 Excel 公式一致） ---------- */
const TIER_A = 1000000, TIER_B = 300000;
function tierOf(v){ return v >= TIER_A ? 'A' : v >= TIER_B ? 'B' : 'C'; }

function analyze(rows){
  const years = [...new Set(rows.map(r => r.y))].sort((a,b) => a-b);
  const F = years[0], L = years[years.length-1];
  const pos = new Map(), first = new Map(), key = new Map();
  for (const r of rows){
    if (r.d > 0){ if (!pos.has(r.id)) pos.set(r.id, []); pos.get(r.id).push(r.y); }
    if (!first.has(r.id) || r.y < first.get(r.id)) first.set(r.id, r.y);
    r.lvl = tierOf(r.h);
    key.set(r.y + '|' + r.id, r);
  }
  for (const r of rows){
    const p = key.get((r.y-1) + '|' + r.id);
    r.prev = p ? p.lvl : '前年未交易';
    // 新客人：第一年不判斷；之前年度從未出現 → 新客人
    r.isNew = r.y === F ? '不判斷' : (first.get(r.id) === r.y ? '新客人' : '現有');
    // 疑似跑單：最近兩年不判斷；本列有下單且之後再也沒下單，或最近五年都沒下單
    if (r.y >= L-1) r.gone = '不判斷';
    else {
      const ys = pos.get(r.id) || [];
      const later = ys.some(t => t > r.y && t <= L);
      const recent = ys.some(t => t >= L-4 && t <= L);
      r.gone = ((r.d > 0 && !later) || !recent) ? '疑似跑單' : '還在';
    }
  }
  // 客戶層級彙總
  const cust = new Map();
  const sorted = rows.slice().sort((a,b) => a.y - b.y);
  for (const r of sorted){
    let c = cust.get(r.id);
    if (!c){ c = {id:r.id, name:r.n, rep:'', moves:[], amt:{}, total:0, first:first.get(r.id), lastPos:null, peak:-Infinity, peakY:null, nYears:0}; cust.set(r.id, c); }
    c.name = r.n || c.name;
    if (r.r && r.r !== c.rep){ if (c.rep) c.moves.push({y:r.y, from:c.rep, to:r.r}); c.rep = r.r; }
    c.amt[r.y] = (c.amt[r.y] || 0) + r.h;
    c.total += r.h;
    if (r.d > 0){ c.lastPos = r.y; c.nYears++; }
    if (r.h > c.peak){ c.peak = r.h; c.peakY = r.y; }
  }
  for (const c of cust.values()){
    c.peakTier = tierOf(c.peak);
    c.status = c.lastPos == null ? '無有效訂單' : c.lastPos <= L-2 ? '疑似跑單' : '還在';
    c.lastAmt = c.lastPos != null ? c.amt[c.lastPos] : 0;
    const tradeYs = Object.keys(c.amt).filter(y => c.amt[y] > 0);
    c.tradeYears = tradeYs.length;
    c.avgAmt = tradeYs.length ? tradeYs.reduce((t, y) => t + c.amt[y], 0) / tradeYs.length : 0; // 有交易年度的平均營業額
  }
  return {years, F, L, cust};
}
</script>
<script id="app">
const S = { rows: [], view: [], merge: {}, lost: {}, itLost: {}, itAlias: {}, itEol: {}, itCAlias: {}, itReason: {}, lostSt: '全部', custSt: '全部', updated: '', source: 'none', baseUpdated: '', A: null, tab: 'overview', year: null, rep: '全部', q: '', abcTier: 'A', lostTier: '全部', lostQ: '', pending: null, delYear: null };
const TABS = [['overview','總覽'],['rep','業務分析'],['custgrp','客戶'],['item','品項分析'],['data','資料管理']];
const CUST_SUB = [['cust','客戶查詢'],['abc','ABC 客戶'],['lost','疑似跑單'],['new','新客人']];
const topOf = t => CUST_SUB.some(x => x[0] === t) ? 'custgrp' : t;
let charts = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const nf0 = new Intl.NumberFormat('zh-TW', {maximumFractionDigits:0});
/* 金額顯示：不到 1 萬顯示「元」，不到 10 萬多一位小數，避免小金額變成「0 萬」 */
const wan = v => { const a = Math.abs(v); if (a < 0.5) return '0'; return a < 1e4 ? nf0.format(Math.round(v)) + ' 元' : a < 1e5 ? (v/1e4).toFixed(1).replace(/\.0$/, '') + ' 萬' : nf0.format(Math.round(v/1e4)) + ' 萬'; };

/* ---------- 加密（AES-256-GCM，金鑰由密碼經 PBKDF2-SHA256 產生） ---------- */
const ENC_ITER = 600000;
const b64e = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };

async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']);
}
async function encryptObj(obj, pass){

  const key = await deriveKey(pass, salt, ENC_ITER);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj))));
  return {v:1, enc:'AES-256-GCM', kdf:'PBKDF2-SHA256', iter:ENC_ITER, updated:obj.updated || '', salt:b64e(salt), iv:b64e(iv), ct:b64e(ct)};
}
async function decryptObj(e, pass){
  const key = await deriveKey(pass, b64d(e.salt), e.iter);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(e.iv)}, key, b64d(e.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const newer = (a, b) => (a && a.updated || '') > (b && b.updated || '');

/* 同一客戶不同編號 → 合併成主編號（同年金額相加） */
function canon(id){ let x = id, n = 0; while (S.merge[x] && n++ < 20) x = S.merge[x]; return x; }
function applyMerge(rows){
  const m = new Map();
  for (const r of rows){
    const id = canon(r.id), k = r.y + '|' + id, o = m.get(k);
    if (!o) m.set(k, {...r, id, orig:r.id});
    else { o.d += r.d; o.h += r.h; if (r.id === id){ o.n = r.n; o.r = r.r || o.r; } o.orig += '+' + r.id; }
  }
  // 合併後一律用主編號最新年度的名稱（主編號那年沒下單也一樣）
  const mainName = new Map();
  for (const r of rows) if (canon(r.id) === r.id && r.n){ const o = mainName.get(r.id); if (!o || r.y >= o.y) mainName.set(r.id, {y:r.y, n:r.n}); }

  return [...m.values()];
}

/* 合併後的客戶編號、各客戶每個品項／規格的購買年度 */
function itPrep(){
  const sig = JSON.stringify(S.merge) + JSON.stringify(S.itAlias || {}) + JSON.stringify(S.itCAlias || {});
  if (IT.P && IT.P.sig === sig) return IT.P;
  const keys = IT.data.keys.map(([disp, base, kind, old, color]) => ({disp, base:itBase(base), kind, old:!!old, color:color || ''}));
  /* 只套用在單一客戶的型號合併：itCAlias「客戶|原型號」→ 算成的型號 */
  const CA = new Map(Object.entries(S.itCAlias || {}).map(([k, v]) => { const i = k.indexOf('|'); return [canon(k.slice(0, i)) + '|' + itBase(k.slice(i + 1)), itBase(v)]; }));
  /* 同一張訂單一起買的配件（壓頭、蓋子…）掛到主瓶：links「客戶|配件型號」→ 主瓶型號（伺服器端用單號算好） */
  const LK = new Map(Object.entries(IT.data.links || {}).map(([k, v]) => { const i = k.indexOf('|'); return [canon(k.slice(0, i)) + '|' + k.slice(i + 1), v]; }));
  const rows = IT.data.rows.map(([id, k, y, m, sh, q, a]) => { const c = canon(id), raw = IT.data.keys[k][1], b0 = keys[k].base, ca = CA.get(c + '|' + b0), lk = !ca && LK.get(c + '|' + raw);
    return {c, k, y, m, sh, q, a, n:1, b:ca || (lk ? itBase(lk) : b0), part:lk ? b0 : null}; });
  const add = (m, key, y) => { let s = m.get(key); if (!s) m.set(key, s = new Set()); s.add(y); };
  const hk = new Map(), hb = new Map();
  for (const r of rows){ if (r.a <= 0) continue; const K = keys[r.k]; if (K.kind === 'F' || K.kind === 'A') continue; add(hk, r.c + '|' + r.k, r.y); add(hb, r.c + '|' + r.b, r.y); }
  IT.cache.clear();
  /* 庫存：型號 → 每個「顏色＋牙徑」一筆 [顏色, 牙徑, 數量, 最後出庫, 進貨日, 區域] */
  const inv = new Map(); if (IT.data.inv) for (const [b, v] of Object.entries(IT.data.inv.m)){ const k = itBase(b); if (!inv.has(k)) inv.set(k, []); inv.get(k).push(...v); }
  return IT.P = {sig, keys, rows, hk, hb, years:IT.data.years, inv};
}
/* 兩個年度比較：客戶 → 規格 → 品項，並把業績變化拆成 不再買／新買／同規格數量／同規格單價／費用折讓 */
function itModel(y0, y1, rep){
  const P = itPrep(), ws = itWords(), key = y0 + '|' + y1 + '|' + rep + '|' + S.view.length + '|' + ws.join(' ');
  if (IT.cache.has(key)) return IT.cache.get(key);
  const RM = new Map(S.view.map(r => [r.y + '|' + r.id, r.r || '(未填)']));
  const inc = (c, y) => rep === '全部' || RM.get(y + '|' + c) === rep;
  const C = new Map();
  for (const r of P.rows){
    const s = r.y === y0 ? 0 : r.y === y1 ? 1 : -1; if (s < 0 || !inc(r.c, r.y)) continue;
    if (P.keys[r.k].kind === 'F' || P.keys[r.k].kind === 'A') continue; // 版費、模具費、折讓等不計算
    if (ws.length){ const K0 = P.keys[r.k], t = (r.b + ' ' + K0.disp + ' ' + K0.color).toLowerCase(); if (!ws.every(w => t.includes(w))) continue; }
    let o = C.get(r.c); if (!o){ const ca = S.A.cust.get(r.c); o = {id:r.c, name:ca ? ca.name : r.c, t0:0, t1:0, sp:new Map()}; C.set(r.c, o); }
    const K = P.keys[r.k], fa = K.kind === 'F' || K.kind === 'A', bk = (fa ? '§' : '') + r.b;
    let sp = o.sp.get(bk); if (!sp){ sp = {base:r.b, fa, q0:0, a0:0, q1:0, a1:0, it:new Map()}; o.sp.set(bk, sp); }
    let it = sp.it.get(r.k); if (!it){ it = {k:r.k, name:K.disp, kind:K.kind, old:K.old, q0:0, a0:0, q1:0, a1:0, n0:0, n1:0}; sp.it.set(r.k, it); }
    sp['q' + s] += r.q; sp['a' + s] += r.a; it['q' + s] += r.q; it['a' + s] += r.a; it['n' + s] += r.n; o['t' + s] += r.a;
  }
  const out = [];
  for (const o of C.values()){
    if (Z(o.t0) && Z(o.t1) && ![...o.sp.values()].some(s => !Z(s.a0) || !Z(s.a1))) continue;
    o.stop = o.nw = o.vol = o.price = o.fee = 0; o.nStop = o.nNew = o.nCont = 0;
    for (const sp of o.sp.values()){
      const d = sp.a1 - sp.a0, hb = P.hb.get(o.id + '|' + sp.base);
      sp.yrs = hb; sp.p0 = sp.q0 ? sp.a0 / sp.q0 : null; sp.p1 = sp.q1 ? sp.a1 / sp.q1 : null; sp.vol = sp.prc = 0;
      if (sp.fa){ sp.st = '費用調整'; o.fee += d; }
      else if (!Z(sp.a0) && Z(sp.a1)){ sp.st = '停購規格'; o.stop += d; o.nStop++; sp.after = hb ? [...hb].filter(y => y > y1).sort((a, b) => a - b)[0] : undefined; }
      else if (Z(sp.a0) && !Z(sp.a1)){ sp.st = hb && [...hb].some(y => y < y0) ? '回購規格' : '新規格'; o.nw += d; o.nNew++; }
      else {
        o.nCont++;
        if (sp.q0 > 0 && sp.q1 > 0 && sp.a0 > 0 && sp.a1 > 0){ sp.vol = (sp.q1 - sp.q0) * sp.a0 / sp.q0; sp.prc = d - sp.vol; } else sp.vol = d;
        o.vol += sp.vol; o.price += sp.prc;
        sp.st = Math.abs(d) <= Math.max(1, Math.abs(sp.a0) * 0.02) ? '持平' : d > 0 ? '成長' : '衰退';
      }
      for (const it of sp.it.values()){
        it.p0 = it.q0 ? it.a0 / it.q0 : null; it.p1 = it.q1 ? it.a1 / it.q1 : null;
        if (sp.fa) it.st = '費用調整';
        else if (!Z(it.a0) && Z(it.a1)) it.st = '停購品項';
        else if (Z(it.a0) && !Z(it.a1)){
          const hk = P.hk.get(o.id + '|' + it.k);
          it.st = hk && [...hk].some(y => y < y1) ? '回購品項' : hb && [...hb].some(y => y < y1) ? '新品項・同規格新品名' : '新品項・全新規格';
        } else it.st = '持續';
      }
    }
    const d = o.t1 - o.t0, ca = S.A.cust.get(o.id);
    if (!Z(o.t0) && Z(o.t1)){ const other = RM.get(y1 + '|' + o.id); o.reason = other && rep !== '全部' ? `轉給 ${other}` : `客戶整體流失（${y1} 年沒下單）`; }
    else if (Z(o.t0) && !Z(o.t1)){ const other = RM.get(y0 + '|' + o.id); o.reason = other && rep !== '全部' ? `由 ${other} 轉入` : ca && ca.first === y1 ? '新客人' : '回流客戶'; }
    else if (Math.abs(d) <= Math.max(1, Math.abs(o.t0) * 0.02)) o.reason = '持平';
    else { const p = [['不再買的規格', o.stop], ['新買的規格', o.nw], ['同規格數量', o.vol], ['同規格單價', o.price], ['費用與折讓', o.fee]].filter(x => Math.sign(x[1]) === Math.sign(d)).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
      o.reason = (d < 0 ? '衰退' : '成長') + '：主因' + (p[0] ? p[0][0] : '—'); }
    out.push(o);
  }
  const M = {y0, y1, rep, cust:out, CM:new Map(out.map(o => [o.id, o])), T0:isum(out, o => o.t0), T1:isum(out, o => o.t1),
    stop:isum(out, o => o.stop), nw:isum(out, o => o.nw), vol:isum(out, o => o.vol), price:isum(out, o => o.price), fee:isum(out, o => o.fee)};
  IT.cache.set(key, M); return M;
}

/* ---------- 回單分析：每位客戶每個規格的第一次下單、回單次數、平均回單週期、距今多久沒回 ---------- */
const fmtM = m => `${Math.floor(m / 12)}/${String(m % 12 + 1).padStart(2, '0')}`;
const LIFE_ST = ['正常回單', '新品觀察中', '逾期未回單', '疑似跑掉', '只買一次', '產品停產', '客戶停賣'];
const lifeColor = s => css({'正常回單':'--good', '新品觀察中':'--accent-2', '逾期未回單':'--warn', '疑似跑掉':'--bad', '只買一次':'--s6', '已換新編碼':'--s5', '產品停產':'--s5', '客戶停賣':'--s4'}[s]);
const lifePill = s => `<span class="pill ${({'正常回單':'pGood', '新品觀察中':'pA', '逾期未回單':'pWarn', '疑似跑掉':'pBad', '只買一次':'pMuted', '已換新編碼':'pMuted', '產品停產':'pEol', '客戶停賣':'pCs'})[s]}">${esc(s)}</span>`;
const median = a => { const b = a.slice().sort((x, y) => x - y), n = b.length; return n ? (n % 2 ? b[(n - 1) / 2] : (b[n / 2 - 1] + b[n / 2]) / 2) : null; };
/* 判斷規則：
   回單 ≥ 2 次：距今 ≤ 週期×1.5（至少 6 個月）→ 正常；≤ 週期×3（至少 12 個月）→ 逾期未回單；更久 → 疑似跑掉
   只下過 1 次：距今 ≤ 12 個月 → 新品觀察中；更久 → 只買一次 */
function lifeStatus(n, cyc, since){
  if (n < 2) return since <= 12 ? '新品觀察中' : '只買一次';
  if (since <= Math.max(cyc * 1.5, 6)) return '正常回單';
  if (since <= Math.max(cyc * 3, 12)) return '逾期未回單';
  return '疑似跑掉';
}
function evStats(ev, mEnd, ship){
  const ms = [...ev.keys()].sort((a, b) => a - b), n = ms.length;
  const gaps = ms.slice(1).map((m, i) => m - ms[i]);
  const lastShip = Math.max(ms[n - 1], ship || 0), cyc = n > 1 ? median(gaps) : null, since = mEnd - lastShip;
  const tot = [...ev.values()].reduce((s, v) => s + v, 0);
  return {ms, n, first:ms[0], last:ms[n - 1], lastShip, gaps, cyc, since, tot, annual:tot / Math.max(1, (ms[n - 1] - ms[0] + 1) / 12), st:lifeStatus(n, cyc, since)};
}
function itLife(){
  const P = itPrep(); if (P.life) return P.life;
  const mEnd = IT.data.mEnd, M0 = Math.min(...IT.data.years) * 12;
  const map = new Map(), cLast = new Map(), cFirst = new Map();
  for (const r of P.rows){
    const K = P.keys[r.k]; if ((K.kind !== 'S' && K.kind !== 'P') || r.a <= 0) continue;
    const key = r.c + '|' + r.b;
    let o = map.get(key); if (!o){ o = {c:r.c, base:r.b, ev:new Map(), items:new Map(), sh:0}; map.set(key, o); }
    o.ev.set(r.m, (o.ev.get(r.m) || 0) + r.a); o.sh = Math.max(o.sh, r.sh);
    /* 單品依「型號＋顏色」分組：舊編號、新編號只要顏色一樣就算同一個；PR46 套組各自一組 */
    /* PR46 套組：同型號＋同【品名】一組（例：CTR120組【X】、CTR120瓶身【X】） */
    const gk = (r.part ? 'A|' + r.part + '|' : K.kind === 'P' ? 'C|' : 'L|') + K.color;
    let it = o.items.get(gk); if (!it){ it = {k:gk, name:r.part ? `${r.part}・${K.color}（同單配件）` : `${r.b}・${K.color}`, kind:K.kind, isColor:true, names:new Map(), ev:new Map(), sh:0, col:K.kind === 'P' ? colN(K.color.split('・')[0]) : '', nk:K.kind === 'P' ? ((K.color.split('・')[1] || '').match(/^\d{2}/) || [''])[0] : '', pb:r.part || r.b}; o.items.set(gk, it); }
    it.names.set(r.k, K);
    it.ev.set(r.m, (it.ev.get(r.m) || 0) + r.a); it.sh = Math.max(it.sh, r.sh);
    cLast.set(r.c, Math.max(cLast.has(r.c) ? cLast.get(r.c) : -1, r.m, r.sh));

function itConfSummary(V){
  const C = V.L.filter(o => o.conf), B = V.L.filter(o => o.back);
  if (!C.length && !B.length) return `<p class="note" style="margin:0">還沒有標記「確定跑掉」的品項。可以在「跑單品項」清單或「客戶品項」時間軸，按每個規格的「確定跑掉」；客戶整個跑單的，在「客戶查詢」按「確定跑單」，他的品項會自動彙整進來。</p>`;
  /* 依客戶彙整：客戶整個跑單 → 流失金額用客戶的年平均（和客戶查詢一致，不重複加總品項）；只有部分品項跑掉 → 加總那些品項的年均 */
  const cm = new Map();
  for (const o of C){
    let x = cm.get(o.c);
    if (!x){ const ca = S.A.cust.get(o.c); x = {id:o.c, name:o.name, rep:o.rep, whole:o.custConf, ca, its:[], a:0, tot:0}; cm.set(o.c, x); }
    x.its.push(o); x.tot += o.tot;
  }
  for (const x of cm.values()){ x.a = x.whole && x.ca ? x.ca.avgAmt : isum(x.its, o => o.annual); x.its.sort((p, q) => q.tot - p.tot); }
  const cs = [...cm.values()].sort((p, q) => q.a - p.a);
  const whole = cs.filter(x => x.whole), part = cs.filter(x => !x.whole);
  const reps = {}; cs.forEach(x => { const r = reps[x.rep] = reps[x.rep] || {n:0, a:0, c:0, w:0}; r.n += x.its.length; r.a += x.a; r.c++; if (x.whole) r.w++; });
  const rows = Object.entries(reps).sort((p, q) => q[1].a - p[1].a);
  return card('確定跑掉的品項（依客戶彙整）', `<section class="kpis">

      ${kpiTile('客戶還在、部分品項跑掉', part.length + '<small> 位</small>', `${isum(part, x => x.its.length)} 個規格・年均 ${bigS(isum(part, x => x.a))}`)}
      ${kpiTile('流失金額合計（年均）', bigS(isum(cs, x => x.a)), '整個跑單用客戶年平均；部分跑掉用品項年平均')}
      ${B.length ? kpiTile('確定後又回單', B.length + '<small> 個</small>', '標記後又有出貨，請再確認') : ''}</section>
    <div class="tw" style="margin-top:12px"><table><thead><tr><th class="l">掛名業務</th><th>客戶數</th><th>其中整個跑單</th><th>規格數</th><th>年均流失金額</th></tr></thead><tbody>${rows.map(([r, x]) => `<tr><td class="l">${esc(r)}</td><td>${x.c}</td><td>${x.w || '–'}</td><td>${x.n}</td><td>${inum(x.a)}</td></tr>`).join('')}</tbody></table></div>
    <details style="margin-top:10px" open><summary class="note" style="cursor:pointer">看每位客戶（${cs.length} 位，點客戶展開品項）</summary><div class="tw" style="max-height:520px;margin-top:8px"><table class="sticky1"><thead><tr><th class="l">客戶</th><th class="l">類型</th><th class="l">掛名業務</th><th>規格數</th><th>年均流失金額</th><th>累計金額</th><th class="l">最後出貨</th></tr></thead><tbody id="itCsb">${cs.map((x, k) =>
      `<tr class="clk" data-ck="${k}"><td class="l"><b style="font-weight:600">${esc(x.name)}</b> <span class="mut" style="font:500 12.5px var(--f-mono)">${esc(x.id)}</span></td><td class="l">${x.whole ? '<span class="pill pBad">客戶整個跑單</span>' : '<span class="pill pWarn">部分品項跑掉</span>'}</td><td class="l">${esc(x.rep)}</td><td>${x.its.length}</td><td>${inum(x.a)}</td><td>${inum(x.tot)}</td><td class="l">${fmtM(Math.max(...x.its.map(o => o.lastShip)))}</td></tr>` +

    '客戶在「客戶查詢」按確定跑單，他的品項會自動彙整成一列；流失金額和「疑似跑單」頁的確定跑單統計一致');
}

function itSearch(V){

      <div id="itSr" style="display:flex;flex-direction:column;gap:16px"></div>

  const fill = () => {
    const ws = (IT.sq || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
    if (!ws.length){ $('#itSr').innerHTML = '<div class="empty">請輸入要找的品項</div>'; return; }
    const hit = t => ws.every(w => t.includes(w));
    const res = [];
    for (const o of V.L){
      const grp = o.its.map(i => ({i, txt:(o.base + ' ' + i.name + ' ' + [...i.names.values()].map(K => K.disp).join(' ')).toLowerCase()})).filter(x => hit(x.txt));
      if (grp.length) res.push({o, grp:grp.map(x => x.i)});
    }
    if (!res.length){ $('#itSr').innerHTML = '<div class="empty">找不到符合的品項</div>'; return; }
    const tot = isum(res, r => isum(r.grp, i => i.tot)), nc = new Set(res.map(r => r.o.c)).size;
    const bm = {}; res.forEach(({o, grp}) => { const m = bm[o.base] = bm[o.base] || {n:new Set(), a:0, bad:0, ok:0}; m.n.add(o.c); m.a += isum(grp, i => i.tot); if (o.st === '疑似跑掉' || o.st === '逾期未回單') m.bad++; if (o.st === '正常回單') m.ok++; });
    const ms = Object.entries(bm).sort((a, b) => b[1].a - a[1].a);
    res.sort((a, b) => Math.max(...b.grp.map(i => i.lastShip)) - Math.max(...a.grp.map(i => i.lastShip)) || isum(b.grp, i => i.tot) - isum(a.grp, i => i.tot));
    $('#itSr').innerHTML = `

      ${ms.length > 1 ? `<div class="tw"><table><thead><tr><th class="l">型號</th><th>客戶數</th><th>正常回單</th><th>需注意</th><th>累計金額</th></tr></thead><tbody>${ms.slice(0, 30).map(([b, m]) => `<tr><td class="l"><b style="font-weight:600">${esc(b)}</b></td><td>${m.n.size}</td><td>${m.ok || '–'}</td><td>${m.bad ? `<span class="down">${m.bad}</span>` : '–'}</td><td>${inum(m.a)}</td></tr>`).join('')}</tbody></table></div>` : ''}

        const g = grp.length === 1 ? grp[0] : null, first = Math.min(...grp.map(i => i.first)), last = Math.max(...grp.map(i => i.lastShip));
        return `<tr><td class="l"><a href="#" data-id="${esc(o.c)}" style="color:var(--accent)">${esc(o.name)}</a></td><td class="l" style="white-space:normal;min-width:260px">${grp.map(i => `<b style="font-weight:600">${esc(i.name)}</b><br><span class="mut" style="font-size:12.5px">${esc([...i.names.values()].slice(0, 2).map(K => K.disp).join('；'))}</span>`).join('<br>')}</td><td class="l">${esc(o.rep)}</td><td class="l">${fmtM(first)}</td><td class="l">${fmtM(last)}</td><td>${g ? g.n : isum(grp, i => i.n)}</td><td>${g ? cycTxt(g) : '<span class="mut">–</span>'}</td><td>${V.mEnd - last} 個月</td><td>${inum(isum(grp, i => i.tot))}</td><td class="l">${grp.map(i => lifePill(i.st)).join(' ')}</td><td class="l">${lifePill(o.st)}</td></tr>`; }).join('')}</tbody></table></div>
      <p class="note" style="margin:0">共 ${res.length} 筆（客戶 × 型號）${res.length > 500 ? '，只列前 500 筆，請再加關鍵字縮小' : ''}；依最後出貨排序，最近的在上面。點客戶名稱看時間軸。</p>`;
  };

/* 客戶業績變化原因：用所有年度看，從高峰年到最近一年，哪些規格停了、哪些變少、哪些是新的 */
function itWhyData(c, V){
  const P = itPrep(), ys = IT.data.years, idx = new Map(ys.map((y, i) => [y, i]));
  const sp = new Map(), tot = ys.map(() => 0);
  for (const r of P.rows){
    if (r.c !== c.id) continue; const K = P.keys[r.k], i = idx.get(r.y); if (i == null || K.kind === 'F' || K.kind === 'A') continue; // 版費、模具費、折讓等不計算
    const b = r.b;
    let o = sp.get(b); if (!o){ o = {b, a:ys.map(() => 0), q:ys.map(() => 0)}; sp.set(b, o); }
    o.a[i] += r.a; o.q[i] += r.q; tot[i] += r.a;
  }
  const last = ys.length - 1; let pk = 0; tot.forEach((v, i) => { if (v > tot[pk]) pk = i; });
  return {ys, sp:[...sp.values()], tot, pk, last};
}
function itWhyHtml(c, V){
  const W = itWhyData(c, V), {ys, tot, pk, last} = W;
  const lo = V.L.filter(o => o.c === c.id), st = new Map(lo.map(o => [o.base, o]));
  let txt;
  if (pk === last || tot[pk] <= 0){
    txt = `<p style="margin:0">${ys[last]} 年是這位客戶的最高峰（${bigS(tot[last])}），目前沒有衰退。</p>`;
  } else {
    const d = W.sp.map(o => ({...o, d:o.a[last] - o.a[pk]})).filter(o => Math.abs(o.d) >= 1);
    const down = d.filter(o => o.d < 0).sort((a, b) => a.d - b.d).slice(0, 6), up = d.filter(o => o.d > 0).sort((a, b) => b.d - a.d).slice(0, 3);
    const why = o => {
      const L = st.get(o.b), qa = o.q[pk], qb = o.q[last];
      if (o.b === '費用與折讓') return '版費、模具費、折讓等變化';
      if (o.a[last] <= 0.5){
        const lastY = ys.filter((y, i) => o.a[i] > 0).pop();
        return `${L ? fmtM(L.lastShip) : lastY + ' 年'} 之後沒再下單${L ? '（' + L.st + (L.conf ? '・已確定跑掉' : '') + (L.custGone ? '・客戶整個沒再下單' : '・客戶還在買別的') + '）' : ''}`;
      }
      if (qa > 0 && qb > 0){ const pa = o.a[pk] / qa, pb = o.a[last] / qb, dq = qb / qa - 1, dp = pb / pa - 1;
        return Math.abs(dq) >= Math.abs(dp) ? `數量減少 ${pct(Math.abs(dq))}（${nf0.format(qa)} → ${nf0.format(qb)}）${Math.abs(dp) >= .05 ? `，單價 ${dp < 0 ? '降' : '漲'} ${pct(Math.abs(dp))}` : ''}`
          : `單價${dp < 0 ? '下降' : '上升'} ${pct(Math.abs(dp))}（${nf2.format(pa)} → ${nf2.format(pb)}）${Math.abs(dq) >= .05 ? `，數量${dq < 0 ? '減少' : '增加'} ${pct(Math.abs(dq))}` : ''}`; }
      return '買得比較少';
    };
    const upWhy = o => o.a[pk] <= 0.5 ? (ys.find((y, i) => o.a[i] > 0) > ys[pk] ? `${ys.find((y, i) => o.a[i] > 0)} 年開始買的新規格` : '回購') : '買得比較多';
    const dropT = tot[last] - tot[pk];
    txt = `<p style="margin:0">品項金額（不含版費、模具費、折讓）從 <b>${ys[pk]} 年高峰 ${bigS(tot[pk])}</b> 到 <b>${ys[last]} 年 ${bigS(tot[last])}</b>，<span class="${dropT < 0 ? 'down' : 'up'}">${sgn(dropT)}</span>。主要原因：</p>
      <div class="tw"><table><thead><tr><th class="l">規格</th><th>${ys[pk]} 年</th><th>${ys[last]} 年</th><th>變化</th><th class="l">原因</th></tr></thead><tbody>${down.map(o => `<tr><td class="l"><b style="font-weight:600">${esc(o.b)}</b></td><td>${inum(o.a[pk])}</td><td>${inum(o.a[last])}</td><td class="down">${sgn(o.d)}</td><td class="l" style="white-space:normal;min-width:240px">${esc(why(o))}</td></tr>`).join('')}${up.map(o => `<tr><td class="l"><b style="font-weight:600">${esc(o.b)}</b></td><td>${inum(o.a[pk])}</td><td>${inum(o.a[last])}</td><td class="up">${sgn(o.d)}</td><td class="l">${esc(upWhy(o))}</td></tr>`).join('')}</tbody></table></div>`;
    /* 高峰年之後才變大、後來又變少或停掉的規格（從高峰年直接比看不出來） */
    const mid = W.sp.filter(o => o.b !== '費用與折讓').map(o => { let m = 0; o.a.forEach((v, i) => { if (v > o.a[m]) m = i; }); return {...o, m}; })
      .filter(o => !down.some(x => x.b === o.b) && o.m > pk && o.m < last && o.a[last] < o.a[o.m] * 0.5 && o.a[o.m] - o.a[last] >= Math.max(1e4, tot[pk] * 0.03)).sort((x, y) => (x.a[last] - x.a[x.m]) - (y.a[last] - y.a[y.m])).slice(0, 5);
    if (mid.length) txt += `<p style="margin:6px 0 0">另外，這些規格是高峰之後才買多、後來又變少或停掉：</p>
      <div class="tw"><table><thead><tr><th class="l">規格</th><th>最多的一年</th><th>${ys[last]} 年</th><th>變化</th><th class="l">原因</th></tr></thead><tbody>${mid.map(o => `<tr><td class="l"><b style="font-weight:600">${esc(o.b)}</b></td><td>${ys[o.m]} 年 ${inum(o.a[o.m])}</td><td>${inum(o.a[last])}</td><td class="down">${sgn(o.a[last] - o.a[o.m])}</td><td class="l" style="white-space:normal;min-width:240px">${esc(why({...o, a:o.a.map((v, i) => i === pk ? o.a[o.m] : v), q:o.q.map((v, i) => i === pk ? o.q[o.m] : v)}))}</td></tr>`).join('')}</tbody></table></div>`;
  }
  return card('這位客戶的業績為什麼變化', txt + `<p class="note" style="margin:0">各規格歷年金額（前 6 大規格＋其他），看哪些規格在哪一年開始變少或消失：</p>` + cvH('cItWhy', 280) + `<div id="itWhyLg"></div>`, `用 ${ys[0]}–${ys[ys.length - 1]} 年所有資料，從業績最高的那一年比到最近一年；不是只比兩年的單年變化`);
}

/* ---------- 業績機會：把分析變成「該找哪位客戶、談什麼」的行動清單 ---------- */
function itActData(V){
  const L = V.L, mEnd = V.mEnd;
  const live = o => !o.conf && !o.eol && o.why !== '客戶停賣';

/* ---------- 新年度業績預估（每月明細 mon.enc.json） ---------- */
const MON = {data:null, loading:false, err:''};
async function monFetch(){
  let r = null;
  try{ r = await fetch('mon.enc.json', {cache:'no-store'}); }catch(e){}
  if (r && r.ok){ const e = await r.json(); if (!S.pass) throw new Error('nopass'); try{ return await decryptObj(e, S.pass); }catch(x){ throw new Error('badpass'); } }
  try{ r = await fetch('mon.json', {cache:'no-store'}); }catch(e){ r = null; }
  if (r && r.ok) return await r.json();
  throw new Error('missing');
}
async function monLoad(){
  if (MON.loading || MON.data) return; MON.loading = true; MON.err = '';
  try{ MON.data = await monFetch(); }catch(e){ MON.err = e.message; }
  MON.loading = false; if (S.tab === 'rep') render();
}
const MON_NAME = ['1 月','2 月','3 月','4 月','5 月','6 月','7 月','8 月','9 月','10 月','11 月','12 月'];
function fcCalc(){
  const D = MON.data, full = D.full || [];
  const repOf = new Map(S.view.map(r => [r.y + '|' + r.id, r.r || '(未填)']));
  const mon = {}; // 年 → 12 個月
  for (const [y, id, m, a] of D.rows){
    if (S.rep !== '全部' && repOf.get(y + '|' + canon(id)) !== S.rep) continue;
    (mon[y] = mon[y] || Array(12).fill(0))[m - 1] += a;
  }
  const sums = yearSums(fRows());
  const L = S.A.L, cur = D.cur && D.cur.y === L ? D.cur : null;  // 最新年度還沒結束
  const fullYs = full.filter(y => mon[y] && mon[y].some(v => v > 0) && y < (cur ? cur.y : L + 1));
  const sY = fullYs.slice(-5);  // 季節比例：最近 5 個完整年度
  if (!sY.length) return null;
  const share = Array(12).fill(0);
  for (const y of sY){ const t = mon[y].reduce((a, b) => a + b, 0) || 1; mon[y].forEach((v, i) => share[i] += v / t / sY.length); }
  // 今年（未結束）全年預估
  let curEst = null, curAct = 0, curCum = 0;
  if (cur){ curAct = sums[cur.y] || 0; curCum = share.slice(0, cur.m).reduce((a, b) => a + b, 0); curEst = curCum > 0.3 ? curAct / curCum : null; }
  const nextY = cur ? cur.y + 1 : L + 1;
  const base = [];  // 近三年
  for (let y = nextY - 3; y < nextY; y++){ const v = (cur && y === cur.y) ? curEst : sums[y]; if (v != null && v > 0) base.push({y, v, est:!!(cur && y === cur.y)}); }
  if (!base.length) return null;
  const avg = base.reduce((a, b) => a + b.v, 0) / base.length;
  const lo = Math.min(...base.map(b => b.v)), hi = Math.max(...base.map(b => b.v));
  const est = share.map(s => avg * s);
  // 高峰月：各年前三名出現次數
  const topCnt = Array(12).fill(0);
  for (const y of sY){ mon[y].map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]).slice(0, 3).forEach(([, i]) => topCnt[i]++); }
  const order = share.map((s, i) => i).sort((a, b) => share[b] - share[a]);
  const lastFull = fullYs[fullYs.length - 1];
  return {mon, sY, share, cur, curAct, curEst, curCum, nextY, base, avg, lo, hi, est, topCnt, peak:order.slice(0, 3), low:order.slice(-3).reverse(), lastFull};
}
function fcCard(){

    const msg = MON.err ? ({missing:'找不到每月資料檔（mon.enc.json）。請確認已和 index.html 一起上傳。', nopass:'每月資料有加密，請重新登入。', badpass:'每月資料的密碼和業績資料不同。'}[MON.err] || MON.err) : '每月資料載入中…';

  const repTxt = S.rep === '全部' ? '' : `（${esc(S.rep)}）`;
  const mList = a => a.map(i => MON_NAME[i]).join('、');
  const peakShare = F.peak.reduce((a, i) => a + F.share[i], 0);
  const tiles = `<div class="kpis" style="margin-bottom:14px">
    ${F.cur && F.curEst ? kpiTile(`${F.cur.y} 年全年預估${repTxt}`, bigS(F.curEst), `目前已做 ${bigS(F.curAct)}，剩下約 ${bigS(Math.max(0, F.curEst - F.curAct))}`) : ''}
    ${kpiTile(`${F.nextY} 年預估${repTxt}`, bigS(F.avg), `大約在 ${bigS(F.lo)} ～ ${bigS(F.hi)} 之間`)}
    ${kpiTile('平均每月', bigS(F.avg / 12), `旺季每月約 ${bigS(F.est[F.peak[0]])}，淡季約 ${bigS(F.est[F.low[0]])}`)}
    ${kpiTile('下單高峰', mList(F.peak), `這 3 個月合計約占全年 ${pct(peakShare)}`)}
  </div>`;
  const say = `<div class="fcsay" style="margin-bottom:12px;line-height:1.9;font-size:16px;background:var(--panel-3);border:1px solid var(--line);border-radius:12px;padding:12px 16px">
    <b>${F.nextY} 年預估約 ${bigS(F.avg)}</b>，是用近 3 年（${F.base.map(b => `${b.y} 年 ${bigS(b.v)}${b.est ? '（全年預估）' : ''}`).join('、')}）平均算出來的；表現差的話約 ${bigS(F.lo)}，好的話約 ${bigS(F.hi)}。<br>
    <b>下單高峰</b>：${F.peak.map(i => `${MON_NAME[i]}（近 ${F.sY.length} 年有 ${F.topCnt[i]} 年是前三名）`).join('、')}。<b>淡季</b>：${mList(F.low)}。<br>
    建議：旺季前 1～2 個月先跟主要客戶確認下單、備好庫存；淡季可以主動聯絡久沒下單的客人。</div>`;
  const rows = MON_NAME.map((n, i) => {
    const last = F.mon[F.lastFull] ? F.mon[F.lastFull][i] : 0, pk = F.peak.includes(i), lw = F.low.includes(i);
    return `<tr${pk ? ' style="background:var(--panel-2)"' : ''}><td class="l">${n}${pk ? ' <span class="pill pGood">高峰</span>' : lw ? ' <span class="mut">淡季</span>' : ''}</td><td>${pct(F.share[i])}</td><td><b>${wan(F.est[i])}</b></td><td>${wan(last)}</td></tr>`;
  }).join('');
  const tbl = `<div class="tw"><table><thead><tr><th class="l">月份</th><th>近 ${F.sY.length} 年平均占全年</th><th>${F.nextY} 年預估</th><th>${F.lastFull} 年實際</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  const note = `每月比例用 ${F.sY[0]}～${F.sY[F.sY.length-1]} 年的出貨明細計算（未稅、未扣折讓，和年度金額差不到 1%）。${F.cur ? `${F.cur.y} 年資料到 ${F.cur.m} 月，12 月以往年比例補估。` : ''}預估只是參考，大客戶突然加單或停單都會讓實際數字差很多。`;
  return card(`${F.nextY} 年業績預估、每月業績、下單高峰${repTxt}`, tiles + say + legendHtml([['下單高峰月', css('--s1')], ['其他月份', css('--s3')]]) + canvas('cFc') + tbl + `<p class="note">${note}</p>`, '上方「業務」選單選一位業務，就會只算他的客戶');
}
function fcDraw(){

function vAbc(){
  const {years} = S.A, Y = S.year, rows = fRows();
  const cnt = t => years.map(y => rows.filter(r => r.y === y && r.lvl === t).length);
  const share = t => years.map(y => { const all = rows.filter(r => r.y === y); const s = all.reduce((a, r) => a + r.h, 0); return s ? all.filter(r => r.lvl === t).reduce((a, r) => a + r.h, 0) / s : 0; });
  // 層級移動矩陣（Y-1 → Y）
  const cust = fCust();
  const prevT = c => c.amt[Y-1] != null ? tierOf(c.amt[Y-1]) : '前年未交易';
  const curT = c => c.amt[Y] != null ? tierOf(c.amt[Y]) : '今年未下單';
  const rowsK = ['A', 'B', 'C', '前年未交易'], colsK = ['A', 'B', 'C', '今年未下單'];
  const M = {}, MC = {}; rowsK.forEach(r => colsK.forEach(c => { M[r + c] = 0; MC[r + c] = []; }));
  cust.filter(c => c.amt[Y-1] != null || c.amt[Y] != null).forEach(c => { const k = prevT(c) + curT(c); M[k]++; MC[k].push(c); });
  const ti = t => 'ABC'.indexOf(t);
  const kindOf = (r, c) => c === '今年未下單' ? '今年沒下單' : r === '前年未交易' ? '新進／回流' : ti(c) < ti(r) ? '升級' : ti(c) > ti(r) ? '降級' : '持平';
  const cats = {'升級':[], '降級':[], '持平':[], '今年沒下單':[], '新進／回流':[]};
  rowsK.forEach(r => colsK.forEach(c => { if (!(r === '前年未交易' && c === '今年未下單')) cats[kindOf(r, c)].push(...MC[r + c]); }));
  const catCls = {'升級':'up', '降級':'down', '持平':'', '今年沒下單':'down', '新進／回流':'up'};
  const sel = S.abcMx || {k:'降級'};
  const selList = sel.r ? MC[sel.r + sel.c] : (cats[sel.k] || []);
  const selTitle = sel.r ? `${sel.r.length === 1 ? sel.r + ' 級' : sel.r} → ${sel.c.length === 1 ? sel.c + ' 級' : sel.c}` : sel.k;
  const cell = (r, c) => { const v = M[r + c], k = kindOf(r, c), on = sel.r === r && sel.c === c; const cls = v ? (k === '升級' || k === '新進／回流' ? 'up' : k === '降級' || k === '今年沒下單' ? 'down' : '') : 'mut';
    return `<td class="${cls}">${v && !(r === '前年未交易' && c === '今年未下單') ? `<button type="button" class="mxb${on ? ' on' : ''}" data-mr="${r}" data-mc="${c}" title="看這 ${v} 位客戶">${v}</button>` : v}</td>`; };
  const matrix = `<div class="chips" id="abcCat" style="margin-bottom:8px">${Object.entries(cats).map(([k, l]) => `<button class="chip" type="button" data-k="${k}" aria-pressed="${!sel.r && sel.k === k}"><span class="${catCls[k]}">${k}</span> ${l.length} 位</button>`).join('')}</div>
    <div class="tw nocard"><table><thead><tr><th class="l">${Y-1} 年 ＼ ${Y} 年</th>${colsK.map(c => `<th>${c.length === 1 ? c + ' 級' : c}</th>`).join('')}</tr></thead><tbody>
    ${rowsK.map(r => `<tr><td class="l">${r.length === 1 ? tierPill(r) + ' 級' : r}</td>${colsK.map(c => cell(r, c)).join('')}</tr>`).join('')}
    </tbody></table></div>
    <p class="note" style="margin:6px 0 0">點上面的分類或表格裡的數字，下面會列出是哪些客戶。</p>
    <h3 style="margin:10px 0 6px;font-size:16px">${esc(selTitle)}：${selList.length} 位</h3>
    <div class="tw" style="max-height:460px"><table class="sticky1"><thead><tr><th class="l">客戶</th><th class="l">掛名業務</th><th class="l">${Y-1} 層級</th><th>${Y-1} 金額</th><th class="l">${Y} 層級</th><th>${Y} 金額</th><th>變化</th></tr></thead><tbody>${selList.slice().sort((a, b) => Math.abs((b.amt[Y] || 0) - (b.amt[Y-1] || 0)) - Math.abs((a.amt[Y] || 0) - (a.amt[Y-1] || 0))).map(c => { const p0 = c.amt[Y-1], p1 = c.amt[Y], d = (p1 || 0) - (p0 || 0);
      return `<tr><td class="l"><b style="font-weight:600">${esc(c.name)}</b> <span class="mut" style="font:500 12.5px var(--f-mono)">${esc(c.id)}</span></td><td class="l">${esc(c.rep || '(未填)')}</td><td class="l">${p0 != null ? tierPill(tierOf(p0)) : '<span class="mut">未交易</span>'}</td><td>${p0 != null ? wan(p0) : '<span class="mut">—</span>'}</td><td class="l">${p1 != null ? tierPill(tierOf(p1)) : '<span class="mut">沒下單</span>'}</td><td>${p1 != null ? wan(p1) : '<span class="mut">—</span>'}</td><td class="${d < 0 ? 'down' : d > 0 ? 'up' : 'mut'}">${d ? (d > 0 ? '+' : '−') + wan(Math.abs(d)) : '—'}</td></tr>`; }).join('') || '<tr><td colspan="7" class="empty">沒有客戶</td></tr>'}</tbody></table></div>`;
  const list = rows.filter(r => r.y === Y && r.lvl === S.abcTier).sort((a, b) => b.h - a.h);
  const listTbl = `<div class="tw" style="max-height:460px"><table><thead><tr><th class="l">客戶</th><th class="l">編號</th><th class="l">業務</th><th>${Y} 金額</th><th>${Y-1} 金額</th><th>成長</th><th class="l">前年層級</th></tr></thead><tbody>
    ${list.map(r => { const p = S.A.cust.get(r.id).amt[Y-1]; return `<tr><td class="l">${esc(r.n)}</td><td class="l mut">${esc(r.id)}</td><td class="l">${esc(r.r)}</td><td>${wan(r.h)}</td><td>${p != null ? wan(p) : '<span class="mut">—</span>'}</td><td>${delta(r.h, p)}</td><td class="l">${tierPill(r.prev)}</td></tr>`; }).join('') || '<tr><td colspan="7" class="empty">沒有符合的客戶</td></tr>'}
  </tbody></table></div>`;
  const lg = legendHtml([['A 級', css('--tA')], ['B 級', css('--tB')], ['C 級', css('--tC')]]);
  $('#main').innerHTML = `
    <div class="rule"><span><b>分級規則</b>（依該年度實際總金額）</span><span>${tierPill('A')} 100 萬以上　${tierPill('B')} 30 萬以上、未滿 100 萬　${tierPill('C')} 未滿 30 萬</span></div>
    <div class="grid2">
      ${card('各年客戶數（依層級）', lg + canvas('cAbcCnt'))}
      ${card('各年營業額占比（依層級）', lg + canvas('cAbcShare'), '少數 A 級客戶通常撐起大部分營業額')}
    </div>
    ${card(`層級變化：${Y-1} → ${Y}`, matrix, '綠色為升級或新進、紅色為降級或今年沒下單；點數字看是哪些客戶')}
    <div>
      <section class="card"><div class="flex"><h2>${Y} 年客戶清單</h2><div class="chips" id="abcChips">${['A', 'B', 'C'].map(t => `<button class="chip" type="button" data-t="${t}" aria-pressed="${S.abcTier === t}">${t} 級 ${rows.filter(r => r.y === Y && r.lvl === t).length}</button>`).join('')}</div></div>${listTbl}</section>
    </div>`;
  const stackDs = (t, data) => barDs(t + ' 級', data, css('--t' + t), {borderWidth:{top:2,bottom:0,left:0,right:0}, borderSkipped:false});
  mk('cAbcCnt', 'bar', {labels:years, datasets:['C', 'B', 'A'].map(t => stackDs(t, cnt(t)))}, baseOpts({stacked:true, count:true, unit:' 位'}));
  mk('cAbcShare', 'bar', {labels:years, datasets:['C', 'B', 'A'].map(t => stackDs(t, share(t)))}, baseOpts({stacked:true, pct:true}));
  $('#abcChips').onclick = e => { const b = e.target.closest('[data-t]'); if (b){ S.abcTier = b.dataset.t; render(); } };
  const keep = () => { const wy = window.scrollY; render(); window.scrollTo(0, wy); };
  $('#abcCat').onclick = e => { const b = e.target.closest('[data-k]'); if (b){ S.abcMx = {k:b.dataset.k}; keep(); } };
  document.querySelectorAll('.mxb').forEach(b => b.onclick = () => { S.abcMx = {r:b.dataset.mr, c:b.dataset.mc}; keep(); });
}

/* ---------- 上傳 / 匯入 ---------- */
const COLS = {y:['年度'], id:['對象編號', '客戶編號', '客戶代號'], n:['對象簡稱', '客戶簡稱', '客戶名稱'], d:['合計金額'], h:['實際總金額'], disc:['折讓金額'], r:['業務']};
function readFile(f){
  if (!window.XLSX){ toast('Excel 讀取元件載入失敗，請重新整理頁面'); return; }
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const wb = XLSX.read(new Uint8Array(fr.result), {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
      let hi = aoa.findIndex((row, i) => i < 15 && row && row.some(c => typeof c === 'string' && COLS.id.some(k => c.includes(k))));
      if (hi < 0) throw new Error('找不到「對象編號」欄位，請確認第一列是欄位名稱');
      const head = aoa[hi].map(c => String(c ?? '').replace(/\s/g, ''));
      const idx = {}; for (const k in COLS) idx[k] = head.findIndex(h => COLS[k].some(w => h.includes(w)));
      const miss = ['id', 'n', 'r'].filter(k => idx[k] < 0).map(k => COLS[k][0]);
      if (idx.d < 0 && idx.h < 0) miss.push('合計金額 或 實際總金額');
      if (miss.length) throw new Error('缺少欄位：' + miss.join('、'));
      const num = v => { if (v == null || v === '') return 0; const x = typeof v === 'number' ? v : parseFloat(String(v).replace(/,/g, '')); return isFinite(x) ? x : 0; };
      const warn = [];
      const needYear = idx.y < 0;
      const defYear = (S.A ? S.A.L : 113) + 1;
      const rows = [];
      for (let i = hi + 1; i < aoa.length; i++){
        const a = aoa[i]; if (!a) continue;
        const id = a[idx.id]; if (id == null || String(id).trim() === '') continue;
        let y = needYear ? defYear : parseInt(a[idx.y], 10);
        if (!needYear && !(y > 0)) continue;
        if (y > 1911) y -= 1911; // 西元轉民國
        const d = idx.d >= 0 ? num(a[idx.d]) : num(a[idx.h]);
        const h = idx.h >= 0 ? num(a[idx.h]) : d - (idx.disc >= 0 ? num(a[idx.disc]) : 0);
        rows.push({y, id:String(id).trim(), n:String(a[idx.n] ?? '').trim(), d:Math.round(d), h:Math.round(h), r:String(a[idx.r] ?? '').trim()});
      }
      if (!rows.length) throw new Error('檔案裡沒有可匯入的資料列');
      if (idx.h < 0) warn.push('沒有「實際總金額」欄，改用合計金額' + (idx.disc >= 0 ? '扣除折讓' : '') + '計算。');
      // 同年同客戶多列 → 合併
      const m = new Map();
      for (const r of rows){ const k = r.y + '|' + r.id; const o = m.get(k); if (o){ o.d += r.d; o.h += r.h; } else m.set(k, r); }
      if (m.size < rows.length) warn.push(`同一年同一客戶有多列，已合併（${rows.length} 列 → ${m.size} 位客戶）。`);
      const noRep = [...m.values()].filter(r => !r.r).length;
      if (noRep) warn.push(`${noRep} 筆沒有填業務。`);
      S.pending = {file:f.name, rows:[...m.values()], warn, needYear, year:defYear,
        summary(){ const g = {}; this.rows.forEach(r => { g[r.y] = g[r.y] || {y:r.y, n:0, s:0}; g[r.y].n++; g[r.y].s += r.h; });
          return Object.values(g).sort((a, b) => a.y - b.y).map(s => ({...s, exist:S.rows.filter(r => r.y === s.y).length})); }};
      S.tab = 'data'; buildControls(); render();
    }catch(e){ toast('無法讀取檔案：' + (e.message || e)); }
  };
  fr.readAsArrayBuffer(f);
}
function applyPending(){
  const p = S.pending; if (!p) return;
  const ys = new Set(p.rows.map(r => r.y));
  S.rows = S.rows.filter(r => !ys.has(r.y)).concat(p.rows);
  S.pending = null;
  const maxY = Math.max(...ys);
  S.year = null;
  afterChange(`已匯入 ${[...ys].sort().join('、')} 年資料`, maxY);
}
async function afterChange(msg, focusYear){
  S.updated = new Date().toISOString();
  recompute();
  if (focusYear && S.A && S.A.years.includes(focusYear)) S.year = focusYear;
  buildControls(); render();
  if (!IN_CLAUDE){
    if (!S.pass){ toast(msg + '。請到「資料管理」設定密碼，才能儲存並下載加密資料檔。', 9000); if (S.tab === 'data') render(); return; }
    let ok = false;
    try{ localStorage.setItem('sales.enc', JSON.stringify(await encryptObj(payload(), S.pass))); ok = true; }catch(e){}
    S.source = ok ? 'local' : S.source;
    if (S.tab === 'data') render();
    toast(ok ? msg + '。已加密存在這台電腦的瀏覽器；要讓其他人也看到，請到「資料管理」下載 data.enc.json 上傳到 GitHub。' : msg + '。瀏覽器無法儲存，重新整理後會回到原本資料，請先下載 data.enc.json。', 9000);
    return;
  }
  /* Claude 版：資料一律加密後才存回頁面（data.enc.json），不存未加密的資料 */
  if (!S.pass){ toast(msg + '。目前沒有密碼，無法加密儲存，請重新整理後輸入密碼。', 9000); return; }
  toast(msg + '，儲存中…', 8000);
  try{
    const art = await window.claude.use('artifact');
    if (!art) throw {code:'unavailable'};
    const enc = await encryptObj(payload(), S.pass);
    await art.publish({'data.enc.json': {content:JSON.stringify(enc), contentType:'application/json'}});
    toast(msg + '，已加密儲存，其他人打開也是最新資料。');
  }catch(e){
    const c = e && e.code;
    const why = c === 'not_writer' || c === 'not_granted' ? '你只有檢視權限，' : c === 'conflict' ? '有其他人剛更新過資料，頁面會重新載入，' : '';
    toast(msg + '。' + why + '這次的變更只在目前畫面有效，沒有存回網頁。', 9000);
    const n = $('#saveNote'); if (n) n.textContent = '這次的變更沒有存回網頁（' + (c || '無法儲存') + '），重新整理後會回到原本資料。';
  }
}

/* ---------- 下載 ---------- */
async function saveFile(filename, blob){
  if (IN_CLAUDE){
    try{
      const dl = await window.claude.use('downloads');
      if (dl){ await dl.save({filename, data:blob}); return; }
    }catch(e){ if (e && e.code && e.code !== 'unavailable') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function downloadXlsx(){
  if (!S.A || !window.XLSX){ toast('Excel 元件載入失敗，請重新整理頁面'); return; }
  const head = ['年度', '對象編號', '對象簡稱', '原始編號', '合計金額(本)', '實際總金額(NTD)', '客戶層級', '前年層級', '新客人', '消失客人', '業務', '掛名業務(最後)', '確定跑單'];
  const aoa = [head, ...S.view.map(r => [r.y, r.id, r.n, r.orig, r.d, r.h, r.lvl, r.prev, r.isNew, r.gone, r.r, S.A.cust.get(r.id).rep, S.A.cust.get(r.id).confirmed ? '是' : ''])];
  const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = head.map((h, i) => ({wch: i === 2 ? 18 : 12}));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, `${S.A.F}~${S.A.L}統整`);
  const buf = XLSX.write(wb, {type:'array', bookType:'xlsx'});
  saveFile(`業績統整_${S.A.F}-${S.A.L}.xlsx`, new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}


/* ---------- 事件 ---------- */
function setYear(y){ S.year = y; store('year', y); $('#selYear').value = y; render(); }
$('#selYear').onchange = e => setYear(+e.target.value);
$('#selRep').onchange = e => { S.rep = e.target.value; store('rep', S.rep); render(); };
$('#mods').onclick = e => { const b = e.target.closest('[data-mod]'); if (!b || b.disabled) return; S.mod = b.dataset.mod; S.custPage = null; store('mod', S.mod); render(); window.scrollTo({top:0}); };
$('#tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (!b) return; S.custPage = null; S.tab = b.dataset.tab === 'custgrp' ? (recall('custSub') || 'cust') : b.dataset.tab; store('tab', S.tab); render(); window.scrollTo({top:0}); };
/* 淺色／深色切換（預設淺色） */
const themeLabel = () => { $('#themeBtn').textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀ 淺色' : '🌙 深色'; };
themeLabel();
$('#themeBtn').onclick = () => { const d = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', d); try{ localStorage.setItem('sales.theme', d); }catch(e){} themeLabel(); if (window.Chart) Chart.defaults.color = css('--ink-2'); };
/* 回首頁按鈕 */
{ const b = document.createElement('button'); b.type = 'button'; b.className = 'totop'; b.innerHTML = '↑<small>回首頁</small>'; b.setAttribute('aria-label', '回到最上面');
  b.onclick = () => { window.scrollTo(0, 0); document.documentElement.scrollTop = 0; }; document.body.append(b);
  let t = 0; addEventListener('scroll', () => { if (!t) t = requestAnimationFrame(() => { t = 0; b.classList.toggle('show', window.scrollY > 300); }); }, {passive:true}); }
$('#btnUpload').onclick = () => $('#fileIn').click();
$('#lockBtn').onclick = () => location.reload();
$('#fileIn').onchange = e => { const f = e.target.files[0]; if (f) readFile(f); e.target.value = ''; };
let themeT; const reTheme = () => { clearTimeout(themeT); themeT = setTimeout(() => { if (S.A || S.tab === 'data') render(); }, 60); };
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', reTheme); }catch(e){}
new MutationObserver(reTheme).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
if (window.Chart){
  Chart.defaults.font.family = css('--f-sans'); Chart.defaults.font.size = 13.5; Chart.defaults.color = css('--ink-2');
  /* 長條圖直接標數字（長輩不用按住才看得到） */
  /* 注意：Chart.js 會把選項裡的函式當成「可依情境計算」的選項執行，所以這裡只傳字串，不傳函式；整段包 try，畫標籤出錯也不影響長條 */
  /* 長條上的數字：億顯示到小數第二位；字會依長條寬度自動縮小，太窄（手機）就改成直的，避免擠在一起 */
  const moneyLbl = v => { const a = Math.abs(v); return a >= 1e8 ? (v/1e8).toFixed(2) + '億' : a >= 1e4 ? nf0.format(Math.round(v/1e4)) + '萬' : nf0.format(Math.round(v)) + '元'; };
  const VFMT = {pct:v => pct(v, 0), count:v => nf0.format(v), money:moneyLbl};
  Chart.register({id:'vlabels', afterDatasetsDraw(ch){ try{
    if (ch.config.type !== 'bar') return; const o = ch.options.plugins && ch.options.plugins.vlabels; if (!o || o.off) return;
    const sc = ch.options.scales || {}; if ((sc.x && sc.x.stacked) || (sc.y && sc.y.stacked)) return;
    const ds = ch.data.datasets.filter((d, i) => ch.isDatasetVisible(i)); if (ds.length !== 1) return;
    const meta = ch.getDatasetMeta(ch.data.datasets.indexOf(ds[0])); const n = meta.data.length; if (n > 16) return;
    const c = ch.ctx, hz = ch.options.indexAxis === 'y', fam = css('--f-mono'), fmt = VFMT[o.kind] || moneyLbl;
    const texts = meta.data.map((el, i) => { const v = ds[0].data[i]; return v == null || Array.isArray(v) || !v ? '' : fmt(v); });
    c.save(); c.fillStyle = css('--ink-2');
    if (hz){ c.font = '600 12px ' + fam; c.textAlign = 'left'; c.textBaseline = 'middle';
      meta.data.forEach((el, i) => { const t = texts[i]; if (t) c.fillText(t, Math.min(el.x + 6, ch.chartArea.right - c.measureText(t).width), el.y); });
    } else {
      const gap = n > 1 ? Math.abs(meta.data[1].x - meta.data[0].x) : ch.chartArea.right - ch.chartArea.left;
      let fs = 12, maxW = 0; const widest = () => { c.font = `600 ${fs}px ${fam}`; maxW = Math.max(...texts.map(t => c.measureText(t).width)); };
      widest(); while (maxW > gap - 4 && fs > 9){ fs--; widest(); }
      const vertical = maxW > gap - 4;
      meta.data.forEach((el, i) => { const t = texts[i]; if (!t) return;
        if (vertical){ c.save(); c.translate(el.x, Math.max(el.y - 4, ch.chartArea.top + c.measureText(t).width)); c.rotate(-Math.PI / 2); c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(t, 0, 0); c.restore(); }
        else { c.textAlign = 'center'; c.textBaseline = 'bottom'; c.fillText(t, el.x, Math.max(el.y - 4, ch.chartArea.top + fs)); } });
    }
    c.restore(); }catch(e){ try{ ch.ctx.restore(); }catch(_){} } }});
  Chart.register({id:'glow',
    beforeDatasetDraw(ch, args){ if (ch.config.type !== 'line') return; const c = ch.ctx; c.save(); c.shadowColor = args.meta.dataset && args.meta.dataset.options ? args.meta.dataset.options.borderColor : 'rgba(56,189,248,.6)'; c.shadowBlur = 6; },
    afterDatasetDraw(ch){ if (ch.config.type !== 'line') return; ch.ctx.restore(); }});
}
load();
