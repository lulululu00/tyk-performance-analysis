table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}

.pBad{background:var(--bad-bg);color:var(--bad)}.pGood{background:var(--good-bg);color:var(--good)}.pWarn{background:var(--warn-bg);color:var(--warn)}.pMuted{background:var(--panel-2);color:var(--ink-3);border:1px solid var(--line)}

.drop{border:2px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--panel-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;max-width:calc(100% - 32px);z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.empty{color:var(--ink-3);padding:16px;text-align:center}
.flex{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<header class="top">
  <div class="topin">
    <div class="row1">
      <div>
        <h1>年度業績分析</h1>
        <div class="sub" id="sub">讀取資料中…</div>
      </div>
      <div class="ctrls">
        <label for="selYear">分析年度 <select id="selYear"></select></label>
        <label for="selRep">業務 <select id="selRep"></select></label>
        <button class="primary" id="btnUpload" type="button">上傳新年度</button>

<div class="wrap"><main id="main"><div class="empty">讀取資料中…</div></main></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script id="logic">
/* ---------- 計算核心（與 Excel 公式一致） ---------- */
const TIER_A = 1000000, TIER_B = 300000;
function tierOf(v){ return v >= TIER_A ? 'A' : v >= TIER_B ? 'B' : 'C'; }

function analyze(rows){
  const years = [...new Set(rows.map(r => r.y))].sort((a,b) => a-b);
  const F = years[0], L = years[years.length-1];
  const pos = new Map(), first = new Map(), key = new Map();
  for (const r of rows){
    if (r.d > 0){ if (!pos.has(r.id)) pos.set(r.id, []); pos.get(r.id).push(r.y); }
    if (!first.has(r.id) || r.y < first.get(r.id)) first.set(r.id, r.y);
    r.lvl = tierOf(r.h);
    key.set(r.y + '|' + r.id, r);
  }
  for (const r of rows){
    const p = key.get((r.y-1) + '|' + r.id);
    r.prev = p ? p.lvl : '前年未交易';
    // 新客人：第一年不判斷；之前年度從未出現 → 新客人
    r.isNew = r.y === F ? '不判斷' : (first.get(r.id) === r.y ? '新客人' : '現有');
    // 疑似跑單：最近兩年不判斷；本列有下單且之後再也沒下單，或最近五年都沒下單
    if (r.y >= L-1) r.gone = '不判斷';
    else {
      const ys = pos.get(r.id) || [];
      const later = ys.some(t => t > r.y && t <= L);
      const recent = ys.some(t => t >= L-4 && t <= L);
      r.gone = ((r.d > 0 && !later) || !recent) ? '疑似跑單' : '還在';
    }
  }
  // 客戶層級彙總
  const cust = new Map();
  const sorted = rows.slice().sort((a,b) => a.y - b.y);
  for (const r of sorted){
    let c = cust.get(r.id);
    if (!c){ c = {id:r.id, name:r.n, rep:r.r, amt:{}, total:0, first:first.get(r.id), lastPos:null, peak:-Infinity, peakY:null, nYears:0}; cust.set(r.id, c); }
    c.name = r.n || c.name; c.rep = r.r || c.rep;
    c.amt[r.y] = (c.amt[r.y] || 0) + r.h;
    c.total += r.h;
    if (r.d > 0){ c.lastPos = r.y; c.nYears++; }
    if (r.h > c.peak){ c.peak = r.h; c.peakY = r.y; }
  }
  for (const c of cust.values()){
    c.peakTier = tierOf(c.peak);
    c.status = c.lastPos == null ? '無有效訂單' : c.lastPos <= L-2 ? '疑似跑單' : '還在';
    c.lastAmt = c.lastPos != null ? c.amt[c.lastPos] : 0;
  }
  return {years, F, L, cust};
}
</script>
<script id="app">
const S = { rows: [], view: [], merge: {}, updated: '', source: 'none', baseUpdated: '', A: null, tab: 'overview', year: null, rep: '全部', q: '', abcTier: 'A', lostTier: '全部', lostQ: '', pending: null, delYear: null };
const TABS = [['overview','總覽'],['rep','業務分析'],['abc','ABC 客戶'],['lost','疑似跑單'],['new','新客人'],['cust','客戶查詢'],['data','資料管理']];
let charts = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const nf0 = new Intl.NumberFormat('zh-TW', {maximumFractionDigits:0});
const wan = v => nf0.format(Math.round(v/1e4)) + ' 萬';
const big = v => Math.abs(v) >= 1e8 ? (v/1e8).toFixed(2) + ' 億' : wan(v);
const axisW = v => Math.abs(v) >= 1e8 ? (v/1e8).toFixed(1).replace(/\.0$/,'') + '億' : nf0.format(v/1e4) + '萬';
const pct = (x, d=1) => (x*100).toFixed(d) + '%';
function delta(cur, prev){
  if (!prev) return '<span class="mut">—</span>';
  const g = (cur - prev) / Math.abs(prev);
  return `<span class="${g >= 0 ? 'up' : 'down'}">${g >= 0 ? '▲' : '▼'} ${pct(Math.abs(g))}</span>`;
}
const tierPill = t => t === 'A' || t === 'B' || t === 'C' ? `<span class="pill p${t}">${t}</span>` : `<span class="pill pMuted">${esc(t)}</span>`;
const statusPill = s => s === '疑似跑單' ? '<span class="pill pBad">⚠ 疑似跑單</span>' : s === '還在' ? '<span class="pill pGood">✓ 還在</span>' : `<span class="pill pMuted">${esc(s)}</span>`;

function store(k, v){ try{ localStorage.setItem('sales.' + k, JSON.stringify(v)); }catch(e){} }
function recall(k){ try{ const v = localStorage.getItem('sales.' + k); return v == null ? null : JSON.parse(v); }catch(e){ return null; } }

let toastT;
function toast(msg, ms=4200){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); }

/* ---------- 資料載入 ---------- */
const IN_CLAUDE = !!(window.claude && window.claude.use);
function parsePayload(j){
  return {rows:(j.rows || []).map(a => ({y:+a[0], id:String(a[1]), n:String(a[2]), d:+a[3], h:+a[4], r:String(a[5] || '')})), merge:j.merge || {}, updated:j.updated || ''};
}
function payload(){
  return {v:2, updated:S.updated, cols:['年度', '對象編號', '對象簡稱', '合計金額', '實際總金額', '業務'], merge:S.merge, rows:S.rows.map(r => [r.y, r.id, r.n, r.d, r.h, r.r])};
}
/* ---------- 加密（AES-256-GCM，金鑰由密碼經 PBKDF2-SHA256 產生） ---------- */
const ENC_ITER = 600000;
const b64e = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']);
}
async function encryptObj(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt, ENC_ITER);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj))));
  return {v:1, enc:'AES-256-GCM', kdf:'PBKDF2-SHA256', iter:ENC_ITER, updated:obj.updated || '', salt:b64e(salt), iv:b64e(iv), ct:b64e(ct)};
}
async function decryptObj(e, pass){
  const key = await deriveKey(pass, b64d(e.salt), e.iter);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(e.iv)}, key, b64d(e.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const newer = (a, b) => (a && a.updated || '') > (b && b.updated || '');

async function load(){
  let base = null, local = null, encBase = null, encLocal = null;
  try{ const res = await fetch('data.enc.json', {cache:'no-store'}); if (res.ok) encBase = await res.json(); }catch(e){}
  if (!encBase){ try{ const res = await fetch('data.json', {cache:'no-store'}); if (res.ok) base = parsePayload(await res.json()); }catch(e){} }
  if (!IN_CLAUDE){
    try{ const t = localStorage.getItem('sales.enc'); if (t) encLocal = JSON.parse(t); }catch(e){}
    try{ localStorage.removeItem('sales.data'); }catch(e){} // 舊版未加密的本機資料一律清掉
  }
  S.encMode = !IN_CLAUDE;
  if (encBase || encLocal){ S.lockInfo = {encBase, encLocal}; S.baseUpdated = encBase ? encBase.updated : ''; showLock(); return; }
  S.baseUpdated = base ? base.updated : '';
  finishLoad(base, base ? 'file' : 'none');
}
function showLock(err){
  $('#lockBtn').hidden = true;
  document.querySelector('.ctrls').hidden = true; $('#tabs').hidden = true;
  $('#sub').textContent = '資料已加密，請輸入密碼';
  $('#main').innerHTML = `<section class="card lock"><h2>🔒 輸入密碼開啟業績資料</h2>
    <form id="lockForm" class="chips"><label for="pw" class="note">密碼</label><input type="password" id="pw" autocomplete="current-password" required style="width:220px"><button class="primary" type="submit" id="pwBtn">解鎖</button></form>
    <p class="note" id="pwMsg">${err ? `<span class="down">${esc(err)}</span>` : '資料以密碼加密存放，沒有密碼的人只會看到亂碼。'}</p></section>`;
  const pw = $('#pw'); pw.focus();
  $('#lockForm').onsubmit = async e => {
    e.preventDefault(); $('#pwBtn').disabled = true; $('#pwMsg').textContent = '解鎖中…';
    const {encBase, encLocal} = S.lockInfo;
    const useLocal = encLocal && (!encBase || newer(encLocal, encBase));
    try{
      const obj = parsePayload(await decryptObj(useLocal ? encLocal : encBase, pw.value));
      S.pass = pw.value;
      document.querySelector('.ctrls').hidden = false; $('#tabs').hidden = false; $('#lockBtn').hidden = false;
      finishLoad(obj, useLocal ? 'local' : 'file');
    }catch(err){
      // 本機版本解不開時（例如已在別台改過密碼），再試 GitHub 版本
      if (useLocal && encBase){ try{ const obj = parsePayload(await decryptObj(encBase, pw.value)); S.pass = pw.value; document.querySelector('.ctrls').hidden = false; $('#tabs').hidden = false; $('#lockBtn').hidden = false; finishLoad(obj, 'file'); toast('本機版本的密碼不同，已改用 GitHub 上的資料'); return; }catch(e2){} }
      showLock('密碼不正確');
    }
  };
}
function finishLoad(use, source){
  S.source = source;
  S.rows = use ? use.rows : []; S.merge = use ? use.merge : {}; S.updated = use ? use.updated : '';
  recompute();
  S.tab = recall('tab') || 'overview';
  const ry = recall('year'); if (ry && S.A && S.A.years.includes(ry)) S.year = ry;
  const rr = recall('rep'); if (rr && repList().includes(rr)) S.rep = rr;
  buildControls(); render();
}
/* 同一客戶不同編號 → 合併成主編號（同年金額相加） */
function canon(id){ let x = id, n = 0; while (S.merge[x] && n++ < 20) x = S.merge[x]; return x; }
function applyMerge(rows){
  const m = new Map();
  for (const r of rows){
    const id = canon(r.id), k = r.y + '|' + id, o = m.get(k);
    if (!o) m.set(k, {...r, id, orig:r.id});
    else { o.d += r.d; o.h += r.h; if (r.id === id){ o.n = r.n; o.r = r.r || o.r; } o.orig += '+' + r.id; }
  }
  return [...m.values()];
}
function recompute(){
  S.rows.sort((a,b) => a.y - b.y || b.h - a.h);
  S.view = applyMerge(S.rows).sort((a,b) => a.y - b.y || b.h - a.h);
  S.A = S.view.length ? analyze(S.view) : null;
  if (S.A && (!S.year || !S.A.years.includes(S.year))) S.year = S.A.L;
}
function repTotals(){
  const m = new Map();
  for (const r of S.view){ const k = r.r || '(未填)'; m.set(k, (m.get(k) || 0) + r.h); }
  return [...m.entries()].sort((a,b) => b[1]-a[1]);
}
const repList = () => repTotals().map(x => x[0]);
/* 主要業務（依歷年總額前五）固定配色，其餘歸「其他」 */
function repGroups(){
  const list = repList(); const major = list.slice(0, 5);
  return {major, groupOf: r => major.includes(r || '(未填)') ? (r || '(未填)') : '其他'};
}
const repColor = (name, major) => { const i = major.indexOf(name); return i >= 0 ? css('--s' + (i+1)) : css('--s6'); };

function fRows(){ return S.rep === '全部' ? S.view : S.view.filter(r => (r.r || '(未填)') === S.rep); }
function fCust(){ const all = [...S.A.cust.values()]; return S.rep === '全部' ? all : all.filter(c => (c.rep || '(未填)') === S.rep); }

function buildControls(){
  const ys = S.A ? S.A.years.slice().reverse() : [];
  $('#selYear').innerHTML = ys.map(y => `<option value="${y}" ${y === S.year ? 'selected' : ''}>${y} 年</option>`).join('');
  $('#selRep').innerHTML = ['全部', ...repList()].map(r => `<option ${r === S.rep ? 'selected' : ''}>${esc(r)}</option>`).join('');
  $('#tabs').innerHTML = TABS.map(([k, t]) => `<button class="tab" role="tab" type="button" data-tab="${k}" aria-selected="${k === S.tab}">${t}</button>`).join('');
  if (S.A){
    const tot = S.view.reduce((s, r) => s + r.h, 0);
    $('#sub').textContent = `${S.A.F}–${S.A.L} 年度 · ${nf0.format(S.view.length)} 筆 · ${nf0.format(S.A.cust.size)} 位客戶 · 累計 ${big(tot)}`;
  } else $('#sub').textContent = '尚無資料';
}

/* ---------- 圖表共用 ---------- */
function killCharts(){ charts.forEach(c => c.destroy()); charts = []; }
function baseOpts(o = {}){
  const ink2 = css('--ink-2'), grid = css('--grid');
  const valFmt = o.pct ? (v => (v*100).toFixed(0) + '%') : o.count ? (v => nf0.format(v)) : axisW;
  const tipFmt = o.pct ? (v => pct(v)) : o.count ? (v => nf0.format(v) + (o.unit || '')) : big;
  const valAxis = {beginAtZero:true, stacked:!!o.stacked, grid:{color:grid, drawTicks:false}, border:{display:false}, ticks:{color:ink2, padding:6, callback:valFmt, maxTicksLimit:6}};
  if (o.pct) valAxis.max = 1;
  const catAxis = {stacked:!!o.stacked, grid:{display:false}, border:{color:css('--line')}, ticks:{color:ink2, autoSkip:false, maxRotation:0}};
  return {
    responsive:true, maintainAspectRatio:false, animation:{duration:250},
    indexAxis: o.horizontal ? 'y' : 'x',
    interaction:{mode: o.line ? 'index' : 'nearest', intersect: !o.line, axis: o.horizontal ? 'y' : 'x'},
    plugins:{
      legend:{display:false},
      tooltip:{backgroundColor:css('--ink'), titleColor:css('--bg'), bodyColor:css('--bg'), padding:10, boxPadding:4, usePointStyle:true,
        callbacks:{label: ctx => ` ${ctx.dataset.label ? ctx.dataset.label + '：' : ''}${tipFmt(ctx.parsed[o.horizontal ? 'x' : 'y'])}`, ...(o.tipExtra || {})}}
    },
    scales: o.horizontal ? {x:valAxis, y:catAxis} : {x:catAxis, y:valAxis},
    onClick: o.onClick
  };
}
function mk(id, type, data, opts){
  const el = document.getElementById(id); if (!el || !window.Chart) return;
  charts.push(new Chart(el, {type, data, options:opts}));
}
const barDs = (label, data, color, extra = {}) => ({label, data, backgroundColor:color, borderRadius:4, borderSkipped:'start', maxBarThickness:38, borderColor:css('--panel'), borderWidth:{top:0,bottom:0,left:0,right:0}, ...extra});
const legendHtml = items => `<div class="legend">${items.map(([n, c]) => `<span><i style="background:${c}"></i>${esc(n)}</span>`).join('')}</div>`;
const card = (title, body, hint = '') => `<section class="card"><h2>${title}</h2>${hint ? `<p class="hint">${hint}</p>` : ''}${body}</section>`;
const canvas = (id, cls = '') => `<div class="cv ${cls}"><canvas id="${id}" role="img" aria-label="圖表"></canvas></div>`;

/* ---------- 主畫面 ---------- */
function render(){
  killCharts();
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === S.tab));
  if (!window.Chart && S.tab !== 'data') { $('#main').innerHTML = '<div class="empty">圖表元件載入失敗，請重新整理頁面。</div>'; return; }
  if (!S.A && S.tab !== 'data'){ S.tab = 'data'; }
  ({overview:vOverview, rep:vRep, abc:vAbc, lost:vLost, new:vNew, cust:vCust, data:vData})[S.tab]();
}

function yearSums(rows){ const m = {}; for (const r of rows) m[r.y] = (m[r.y] || 0) + r.h; return m; }

function vOverview(){

  const cy = rows.filter(r => r.y === Y), py = rows.filter(r => r.y === Y-1);
  const newY = cy.filter(r => r.isNew === '新客人');

  const tileRev = sums[Y] || 0, tilePrev = sums[Y-1] || 0;
  const aShare = tileRev ? aY.reduce((s, r) => s + r.h, 0) / tileRev : 0;
  const kpi = (k, v, d) => `<div class="kpi"><span class="k">${k}</span><span class="v">${v}</span><span class="d">${d}</span></div>`;
  const repTxt = S.rep === '全部' ? '' : `（${esc(S.rep)}）`;
  $('#main').innerHTML = `
  <section class="kpis">
    ${kpi(`${Y} 年營業額${repTxt}`, big(tileRev), `較 ${Y-1} 年 ${delta(tileRev, tilePrev)}`)}
    ${kpi('交易客戶數', nf0.format(cy.length) + '<small>位</small>', `${Y-1} 年 ${nf0.format(py.length)} 位 ${delta(cy.length, py.length)}`)}
    ${kpi('新客人', Y === F ? '—' : nf0.format(newY.length) + '<small>位</small>', Y === F ? '首年不判斷' : `貢獻 ${big(newY.reduce((s, r) => s + r.h, 0))}`)}
    ${kpi('A 級客戶', nf0.format(aY.length) + '<small>位</small>', `占營業額 ${pct(aShare)}`)}
    ${kpi('疑似跑單客戶（累計）', nf0.format(lostC.length) + '<small>位</small>', `最後下單在 ${S.A.L-2} 年（含）以前`)}
  </section>
  <div class="grid2">
    ${card('歷年營業額', canvas('cRev'), '點選長條可切換分析年度')}
    ${card('歷年交易客戶數', legendHtml([['現有客戶', css('--bar-dim')], ['新客人', css('--s3')]]) + canvas('cCnt'))}
  </div>
  <div class="grid2">
    ${card(`${Y} 年前十大客戶`, canvas('cTop', 'tall'))}
    ${card(`${Y} 年各業務營業額`, canvas('cRepY', 'tall'))}
  </div>`;
  mk('cRev', 'bar', {labels:years, datasets:[barDs('營業額', years.map(y => sums[y] || 0), years.map(y => y === Y ? css('--accent') : css('--bar-dim')))]},
    baseOpts({onClick:(e, els) => { if (els.length){ setYear(years[els[0].index]); } }}));
  const exist = years.map(y => rows.filter(r => r.y === y && r.isNew !== '新客人').length);
  const neu = years.map(y => rows.filter(r => r.y === y && r.isNew === '新客人').length);
  mk('cCnt', 'bar', {labels:years, datasets:[barDs('現有客戶', exist, css('--bar-dim')), barDs('新客人', neu, css('--s3'), {borderWidth:{top:2,bottom:0,left:0,right:0}, borderSkipped:false})]}, baseOpts({stacked:true, count:true, unit:' 位'}));
  const top = cy.slice().sort((a, b) => b.h - a.h).slice(0, 10);
  mk('cTop', 'bar', {labels:top.map(r => r.n), datasets:[barDs(`${Y} 年`, top.map(r => r.h), css('--bar'))]},
    baseOpts({horizontal:true, tipExtra:{afterLabel: ctx => { const r = top[ctx.dataIndex]; const p = S.A.cust.get(r.id).amt[Y-1]; return ` 業務：${r.r}　層級：${r.lvl}　前年：${p ? big(p) : '未交易'}`; }}}));
  const {major} = repGroups();
  const byRep = {}; for (const r of cy) byRep[r.r || '(未填)'] = (byRep[r.r || '(未填)'] || 0) + r.h;
  const reps = Object.entries(byRep).sort((a, b) => b[1] - a[1]);
  mk('cRepY', 'bar', {labels:reps.map(x => x[0]), datasets:[barDs(`${Y} 年`, reps.map(x => x[1]), reps.map(x => repColor(x[0], major)))]}, baseOpts({horizontal:true}));
}

function vRep(){
  const {years, L} = S.A, Y = S.year;
  const {major, groupOf} = repGroups();
  const rows = fRows();
  const groups = S.rep === '全部' ? [...major, ...(repList().length > 5 ? ['其他'] : [])] : [S.rep];
  const series = groups.map(g => ({g, data:years.map(y => rows.filter(r => r.y === y && (S.rep === '全部' ? groupOf(r.r) === g : true)).reduce((s, r) => s + r.h, 0))}));
  // 表格
  const reps = S.rep === '全部' ? repList() : [S.rep];
  const totY = S.view.filter(r => r.y === Y).reduce((s, r) => s + r.h, 0);
  const custAll = [...S.A.cust.values()];
  const trs = reps.map(rep => {
    const cy = S.view.filter(r => r.y === Y && (r.r || '(未填)') === rep), py = S.view.filter(r => r.y === Y-1 && (r.r || '(未填)') === rep);
    const a = cy.reduce((s, r) => s + r.h, 0), p = py.reduce((s, r) => s + r.h, 0);
    const t = {A:0, B:0, C:0}; cy.forEach(r => t[r.lvl]++);
    const nw = cy.filter(r => r.isNew === '新客人').length;
    const lost = custAll.filter(c => (c.rep || '(未填)') === rep && c.status === '疑似跑單').length;
    return {rep, a, p, t, n:cy.length, nw, lost};
  }).filter(x => x.a || x.p || x.n);
  trs.sort((x, y) => y.a - x.a);
  const maxA = Math.max(1, ...trs.map(x => x.a));
  const table = `<div class="tw"><table><thead><tr><th class="l">業務</th><th>${Y} 營業額</th><th>${Y-1} 營業額</th><th>成長</th><th>占全公司</th><th>客戶數</th><th>A</th><th>B</th><th>C</th><th>新客人</th><th>疑似跑單（累計）</th></tr></thead><tbody>
    ${trs.map(x => `<tr><td class="l"><i class="bar-in" style="width:10px;background:${repColor(x.rep, major)}"></i>${esc(x.rep)}</td><td><span class="bar-in" style="width:${Math.round(60 * x.a / maxA)}px"></span>${wan(x.a)}</td><td>${wan(x.p)}</td><td>${delta(x.a, x.p)}</td><td>${totY ? pct(x.a / totY) : '—'}</td><td>${x.n}</td><td>${x.t.A}</td><td>${x.t.B}</td><td>${x.t.C}</td><td>${x.nw}</td><td>${x.lost ? `<span class="down">${x.lost}</span>` : 0}</td></tr>`).join('') || '<tr><td colspan="11" class="empty">這一年沒有資料</td></tr>'}
  </tbody></table></div>`;
  $('#main').innerHTML = `
    ${card('各業務歷年營業額趨勢', legendHtml(series.map(s => [s.g, repColor(s.g, major)])) + canvas('cRepLine', 'tall'), S.rep === '全部' ? '依歷年累計前五名的業務分線，其餘合併為「其他」' : '')}
    ${card(`${Y} 年各業務業績`, table, '「疑似跑單」為該業務名下最後下單年度在 ' + (L-2) + ' 年（含）以前的客戶數')}
    ${card(`${Y} 年各業務客戶層級分布`, legendHtml([['A 級（≥100 萬）', css('--tA')], ['B 級（30–100 萬）', css('--tB')], ['C 級（<30 萬）', css('--tC')]]) + canvas('cRepTier'))}`;
  mk('cRepLine', 'line', {labels:years, datasets:series.map(s => ({label:s.g, data:s.data, borderColor:repColor(s.g, major), backgroundColor:repColor(s.g, major), borderWidth:2, pointRadius:3, pointHoverRadius:5, tension:.25}))}, baseOpts({line:true}));
  mk('cRepTier', 'bar', {labels:trs.map(x => x.rep), datasets:['A', 'B', 'C'].map(t => barDs(t + ' 級', trs.map(x => x.t[t]), css('--t' + t), {borderWidth:{top:0,bottom:0,left:0,right:2}, borderSkipped:false}))}, baseOpts({horizontal:true, stacked:true, count:true, unit:' 位'}));
}

function vAbc(){
  const {years} = S.A, Y = S.year, rows = fRows();
  const cnt = t => years.map(y => rows.filter(r => r.y === y && r.lvl === t).length);
  const share = t => years.map(y => { const all = rows.filter(r => r.y === y); const s = all.reduce((a, r) => a + r.h, 0); return s ? all.filter(r => r.lvl === t).reduce((a, r) => a + r.h, 0) / s : 0; });
  // 層級移動矩陣（Y-1 → Y）
  const cust = fCust();
  const prevT = c => c.amt[Y-1] != null ? tierOf(c.amt[Y-1]) : '前年未交易';
  const curT = c => c.amt[Y] != null ? tierOf(c.amt[Y]) : '今年未下單';
  const rowsK = ['A', 'B', 'C', '前年未交易'], colsK = ['A', 'B', 'C', '今年未下單'];
  const M = {}; rowsK.forEach(r => colsK.forEach(c => M[r + c] = 0));
  cust.filter(c => c.amt[Y-1] != null || c.amt[Y] != null).forEach(c => M[prevT(c) + curT(c)]++);
  const matrix = `<div class="tw"><table><thead><tr><th class="l">${Y-1} 年 ＼ ${Y} 年</th>${colsK.map(c => `<th>${c.length === 1 ? c + ' 級' : c}</th>`).join('')}</tr></thead><tbody>
    ${rowsK.map(r => `<tr><td class="l">${r.length === 1 ? tierPill(r) + ' 級' : r}</td>${colsK.map(c => { const v = M[r + c]; const up = 'ABC'.indexOf(c) >= 0 && 'ABC'.indexOf(r) >= 0 && 'ABC'.indexOf(c) < 'ABC'.indexOf(r); const dn = ('ABC'.indexOf(c) > 'ABC'.indexOf(r) && 'ABC'.indexOf(r) >= 0) || (c === '今年未下單'); return `<td class="${v ? (up ? 'up' : dn ? 'down' : '') : 'mut'}">${v}</td>`; }).join('')}</tr>`).join('')}
  </tbody></table></div>`;
  const list = rows.filter(r => r.y === Y && r.lvl === S.abcTier).sort((a, b) => b.h - a.h);
  const listTbl = `<div class="tw" style="max-height:460px"><table><thead><tr><th class="l">客戶</th><th class="l">編號</th><th class="l">業務</th><th>${Y} 金額</th><th>${Y-1} 金額</th><th>成長</th><th class="l">前年層級</th></tr></thead><tbody>
    ${list.map(r => { const p = S.A.cust.get(r.id).amt[Y-1]; return `<tr><td class="l">${esc(r.n)}</td><td class="l mut">${esc(r.id)}</td><td class="l">${esc(r.r)}</td><td>${wan(r.h)}</td><td>${p != null ? wan(p) : '<span class="mut">—</span>'}</td><td>${delta(r.h, p)}</td><td class="l">${tierPill(r.prev)}</td></tr>`; }).join('') || '<tr><td colspan="7" class="empty">沒有符合的客戶</td></tr>'}
  </tbody></table></div>`;
  const lg = legendHtml([['A 級', css('--tA')], ['B 級', css('--tB')], ['C 級', css('--tC')]]);
  $('#main').innerHTML = `
    <div class="rule"><span><b>分級規則</b>（依該年度實際總金額）</span><span>${tierPill('A')} 100 萬以上　${tierPill('B')} 30 萬以上、未滿 100 萬　${tierPill('C')} 未滿 30 萬</span></div>
    <div class="grid2">
      ${card('各年客戶數（依層級）', lg + canvas('cAbcCnt'))}
      ${card('各年營業額占比（依層級）', lg + canvas('cAbcShare'), '少數 A 級客戶通常撐起大部分營業額')}
    </div>
    <div class="grid3">
      <section class="card"><div class="flex"><h2>${Y} 年客戶清單</h2><div class="chips" id="abcChips">${['A', 'B', 'C'].map(t => `<button class="chip" type="button" data-t="${t}" aria-pressed="${S.abcTier === t}">${t} 級 ${rows.filter(r => r.y === Y && r.lvl === t).length}</button>`).join('')}</div></div>${listTbl}</section>
      ${card(`層級變化：${Y-1} → ${Y}`, matrix, '綠色為升級、紅色為降級或今年沒下單（客戶數）')}
    </div>`;
  const stackDs = (t, data) => barDs(t + ' 級', data, css('--t' + t), {borderWidth:{top:2,bottom:0,left:0,right:0}, borderSkipped:false});
  mk('cAbcCnt', 'bar', {labels:years, datasets:['C', 'B', 'A'].map(t => stackDs(t, cnt(t)))}, baseOpts({stacked:true, count:true, unit:' 位'}));
  mk('cAbcShare', 'bar', {labels:years, datasets:['C', 'B', 'A'].map(t => stackDs(t, share(t)))}, baseOpts({stacked:true, pct:true}));
  $('#abcChips').onclick = e => { const b = e.target.closest('[data-t]'); if (b){ S.abcTier = b.dataset.t; render(); } };
}

function vLost(){
  const {years, L} = S.A;
  const cust = fCust();
  const lost = cust.filter(c => c.status === '疑似跑單');
  const watch = cust.filter(c => c.lastPos === L-1).sort((a, b) => b.lastAmt - a.lastAmt);
  const lastYears = years.filter(y => y <= L-2);
  const {major} = repGroups();
  let list = lost.filter(c => S.lostTier === '全部' || c.peakTier === S.lostTier);
  if (S.lostQ) { const q = S.lostQ.toLowerCase(); list = list.filter(c => c.name.toLowerCase().includes(q) || c.id.toLowerCase().includes(q)); }
  list.sort((a, b) => b.total - a.total);
  const lostLastSum = lost.reduce((s, c) => s + c.lastAmt, 0);
  const kpi = (k, v, d) => `<div class="kpi"><span class="k">${k}</span><span class="v">${v}</span><span class="d">${d}</span></div>`;
  const repCount = {}; lost.forEach(c => { const k = c.rep || '(未填)'; repCount[k] = repCount[k] || {A:0, B:0, C:0}; repCount[k][c.peakTier]++; });
  const repK = Object.keys(repCount).sort((a, b) => (repCount[b].A + repCount[b].B + repCount[b].C) - (repCount[a].A + repCount[a].B + repCount[a].C));
  $('#main').innerHTML = `
    <div class="rule"><span><b>判斷規則</b>：${L-1}、${L} 年的資料不判斷。某年有下單、之後到 ${L} 年都沒再下單，或 ${L-4}–${L} 年完全沒下單，即列為「疑似跑單」。</span><span>例：最後一次下單在 106 年，之後到 ${L} 年都沒有訂單 → 疑似跑單。上傳新年度後，判斷區間會自動往後移。</span></div>
    <section class="kpis">
      ${kpi('疑似跑單客戶', nf0.format(lost.length) + '<small>位</small>', `占全部客戶 ${pct(lost.length / Math.max(1, cust.length))}`)}
      ${kpi('曾為 A 級的跑單客戶', nf0.format(lost.filter(c => c.peakTier === 'A').length) + '<small>位</small>', '單年最高金額 ≥ 100 萬')}
      ${kpi('跑單前最後一年營業額合計', big(lostLastSum), '可視為流失的年營業額規模')}
      ${kpi(`觀察名單（${L-1} 有、${L} 無）`, nf0.format(watch.length) + '<small>位</small>', `${L-1} 年金額合計 ${big(watch.reduce((s, c) => s + c.lastAmt, 0))}`)}
    </section>
    <div class="grid2">
      ${card('依最後下單年度', canvas('cLostY'), '每年有多少客戶在那一年之後就沒再下單')}
      ${card('各業務的疑似跑單客戶', legendHtml([['曾為 A 級', css('--tA')], ['曾為 B 級', css('--tB')], ['C 級', css('--tC')]]) + canvas('cLostRep'), '依客戶歷年最高層級')}
    </div>
    <section class="card">
      <div class="flex"><h2>疑似跑單客戶清單</h2>
        <div class="chips"><span class="note">最高層級</span><span id="lostChips" class="chips">${['全部', 'A', 'B', 'C'].map(t => `<button class="chip" type="button" data-t="${t}" aria-pressed="${S.lostTier === t}">${t}</button>`).join('')}</span>

/* ---------- 上傳 / 匯入 ---------- */
const COLS = {y:['年度'], id:['對象編號', '客戶編號', '客戶代號'], n:['對象簡稱', '客戶簡稱', '客戶名稱'], d:['合計金額'], h:['實際總金額'], disc:['折讓金額'], r:['業務']};
function readFile(f){
  if (!window.XLSX){ toast('Excel 讀取元件載入失敗，請重新整理頁面'); return; }
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const wb = XLSX.read(new Uint8Array(fr.result), {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
      let hi = aoa.findIndex((row, i) => i < 15 && row && row.some(c => typeof c === 'string' && COLS.id.some(k => c.includes(k))));
      if (hi < 0) throw new Error('找不到「對象編號」欄位，請確認第一列是欄位名稱');
      const head = aoa[hi].map(c => String(c ?? '').replace(/\s/g, ''));
      const idx = {}; for (const k in COLS) idx[k] = head.findIndex(h => COLS[k].some(w => h.includes(w)));
      const miss = ['id', 'n', 'r'].filter(k => idx[k] < 0).map(k => COLS[k][0]);
      if (idx.d < 0 && idx.h < 0) miss.push('合計金額 或 實際總金額');
      if (miss.length) throw new Error('缺少欄位：' + miss.join('、'));
      const num = v => { if (v == null || v === '') return 0; const x = typeof v === 'number' ? v : parseFloat(String(v).replace(/,/g, '')); return isFinite(x) ? x : 0; };
      const warn = [];
      const needYear = idx.y < 0;
      const defYear = (S.A ? S.A.L : 113) + 1;
      const rows = [];
      for (let i = hi + 1; i < aoa.length; i++){
        const a = aoa[i]; if (!a) continue;
        const id = a[idx.id]; if (id == null || String(id).trim() === '') continue;
        let y = needYear ? defYear : parseInt(a[idx.y], 10);
        if (!needYear && !(y > 0)) continue;
        if (y > 1911) y -= 1911; // 西元轉民國
        const d = idx.d >= 0 ? num(a[idx.d]) : num(a[idx.h]);
        const h = idx.h >= 0 ? num(a[idx.h]) : d - (idx.disc >= 0 ? num(a[idx.disc]) : 0);
        rows.push({y, id:String(id).trim(), n:String(a[idx.n] ?? '').trim(), d:Math.round(d), h:Math.round(h), r:String(a[idx.r] ?? '').trim()});
      }
      if (!rows.length) throw new Error('檔案裡沒有可匯入的資料列');
      if (idx.h < 0) warn.push('沒有「實際總金額」欄，改用合計金額' + (idx.disc >= 0 ? '扣除折讓' : '') + '計算。');
      // 同年同客戶多列 → 合併
      const m = new Map();
      for (const r of rows){ const k = r.y + '|' + r.id; const o = m.get(k); if (o){ o.d += r.d; o.h += r.h; } else m.set(k, r); }
      if (m.size < rows.length) warn.push(`同一年同一客戶有多列，已合併（${rows.length} 列 → ${m.size} 位客戶）。`);
      const noRep = [...m.values()].filter(r => !r.r).length;
      if (noRep) warn.push(`${noRep} 筆沒有填業務。`);
      S.pending = {file:f.name, rows:[...m.values()], warn, needYear, year:defYear,
        summary(){ const g = {}; this.rows.forEach(r => { g[r.y] = g[r.y] || {y:r.y, n:0, s:0}; g[r.y].n++; g[r.y].s += r.h; });
          return Object.values(g).sort((a, b) => a.y - b.y).map(s => ({...s, exist:S.rows.filter(r => r.y === s.y).length})); }};
      S.tab = 'data'; buildControls(); render();
    }catch(e){ toast('無法讀取檔案：' + (e.message || e)); }
  };
  fr.readAsArrayBuffer(f);
}
function applyPending(){
  const p = S.pending; if (!p) return;
  const ys = new Set(p.rows.map(r => r.y));
  S.rows = S.rows.filter(r => !ys.has(r.y)).concat(p.rows);
  S.pending = null;
  const maxY = Math.max(...ys);
  S.year = null;
  afterChange(`已匯入 ${[...ys].sort().join('、')} 年資料`, maxY);
}
async function afterChange(msg, focusYear){
  S.updated = new Date().toISOString();
  recompute();
  if (focusYear && S.A && S.A.years.includes(focusYear)) S.year = focusYear;
  buildControls(); render();
  if (!IN_CLAUDE){
    if (!S.pass){ toast(msg + '。請到「資料管理」設定密碼，才能儲存並下載加密資料檔。', 9000); if (S.tab === 'data') render(); return; }
    let ok = false;
    try{ localStorage.setItem('sales.enc', JSON.stringify(await encryptObj(payload(), S.pass))); ok = true; }catch(e){}
    S.source = ok ? 'local' : S.source;
    if (S.tab === 'data') render();
    toast(ok ? msg + '。已加密存在這台電腦的瀏覽器；要讓其他人也看到，請到「資料管理」下載 data.enc.json 上傳到 GitHub。' : msg + '。瀏覽器無法儲存，重新整理後會回到原本資料，請先下載 data.enc.json。', 9000);
    return;
  }
  toast(msg + '，儲存中…', 8000);
  try{
    const art = await window.claude.use('artifact');
    if (!art) throw {code:'unavailable'};
    await art.publish({'data.json': {content:JSON.stringify(payload()), contentType:'application/json'}});
    toast(msg + '，已儲存，之後打開網頁都是最新資料。');
  }catch(e){
    const c = e && e.code;
    const why = c === 'not_writer' || c === 'not_granted' ? '你只有檢視權限，' : c === 'conflict' ? '有其他人剛更新過資料，頁面會重新載入，' : '';
    toast(msg + '。' + why + '這次的變更只在目前畫面有效，沒有存回網頁。', 9000);
    const n = $('#saveNote'); if (n) n.textContent = '這次的變更沒有存回網頁（' + (c || '無法儲存') + '），重新整理後會回到原本資料。';
  }
}

/* ---------- 下載 ---------- */
async function saveFile(filename, blob){
  if (IN_CLAUDE){
    try{
      const dl = await window.claude.use('downloads');
      if (dl){ await dl.save({filename, data:blob}); return; }
    }catch(e){ if (e && e.code && e.code !== 'unavailable') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function downloadXlsx(){
  if (!S.A || !window.XLSX){ toast('Excel 元件載入失敗，請重新整理頁面'); return; }
  const head = ['年度', '對象編號', '對象簡稱', '原始編號', '合計金額(本)', '實際總金額(NTD)', '客戶層級', '前年層級', '新客人', '消失客人', '業務'];
  const aoa = [head, ...S.view.map(r => [r.y, r.id, r.n, r.orig, r.d, r.h, r.lvl, r.prev, r.isNew, r.gone, r.r])];
  const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = head.map((h, i) => ({wch: i === 2 ? 18 : 12}));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, `${S.A.F}~${S.A.L}統整`);
  const buf = XLSX.write(wb, {type:'array', bookType:'xlsx'});
  saveFile(`業績統整_${S.A.F}-${S.A.L}.xlsx`, new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}


/* ---------- 事件 ---------- */
function setYear(y){ S.year = y; store('year', y); $('#selYear').value = y; render(); }
$('#selYear').onchange = e => setYear(+e.target.value);
$('#selRep').onchange = e => { S.rep = e.target.value; store('rep', S.rep); render(); };
$('#tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (!b) return; S.tab = b.dataset.tab; store('tab', S.tab); render(); window.scrollTo({top:0}); };
$('#btnUpload').onclick = () => $('#fileIn').click();
$('#lockBtn').onclick = () => location.reload();
$('#fileIn').onchange = e => { const f = e.target.files[0]; if (f) readFile(f); e.target.value = ''; };
let themeT; const reTheme = () => { clearTimeout(themeT); themeT = setTimeout(() => { if (S.A || S.tab === 'data') render(); }, 60); };
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', reTheme); }catch(e){}
new MutationObserver(reTheme).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
if (window.Chart){ Chart.defaults.font.family = getComputedStyle(document.body).fontFamily; Chart.defaults.font.size = 12; }
load();
</script>
